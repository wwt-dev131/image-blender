}

// ==================== LINE CUT ====================
// Cut the selected sticker into independent pieces along background lines
// (auto-detected via Sobel + Otsu) and/or hand-drawn lines. Each piece becomes
// a normal sticker, so selection / transform / layers / undo / export all work.
function expandCutRegion(bb) {
  const x = Math.max(0, Math.floor(bb.x) - CUT_PAD);
  const y = Math.max(0, Math.floor(bb.y) - CUT_PAD);
  const w = Math.min(canvas.width, Math.ceil(bb.x + bb.w) + CUT_PAD) - x;
  const h = Math.min(canvas.height, Math.ceil(bb.y + bb.h) + CUT_PAD) - y;
  return { x, y, w, h };
}

function enterCutMode() {
  if (!selectedId || cutState.active) return;
  const sticker = stickers.find(s => s.id === selectedId);
  if (!sticker) return;

  const region = expandCutRegion(getStickerBoundingRect(sticker));
  if (region.w <= 0 || region.h <= 0) return;

  cutState.active = true;
  cutState.stickerId = sticker.id;
  cutState.region = region;
  cutState.autoWall = null;
  cutState.manualWall = new Uint8Array(canvas.width * canvas.height);
  cutState.brush = false;
  cutState.brushActive = false;
  cutState.lastPoint = null;
  cutState.analyzing = true;

  // cache the sticker rasterised into the region (alpha source for flood fill)
  const temp = rasterizeStickerToCanvas(sticker, region);
  cutState.regionAlpha = temp.getContext('2d').getImageData(0, 0, region.w, region.h).data;

  // compute the sticker's opaque bounding box (region coords)
  {
    const d = cutState.regionAlpha;
    let bx = 1e9, by = 1e9, BX = -1, BY = -1;
    for (let y = 0; y < region.h; y++) for (let x = 0; x < region.w; x++) {
      if (d[(y * region.w + x) * 4 + 3] >= ALPHA_MIN) {
        if (x < bx) bx = x; if (x > BX) BX = x;
        if (y < by) by = y; if (y > BY) BY = y;
      }
    }
    cutState.stickerBox = BX >= 0 ? { minX: bx, minY: by, maxX: BX, maxY: BY } : { minX: 0, minY: 0, maxX: region.w - 1, maxY: region.h - 1 };
  }

  // empty overlay canvas for highlighting + brush drawing
  cutState.overlay = document.createElement('canvas');
  cutState.overlay.width = canvas.width;
  cutState.overlay.height = canvas.height;

  const bar = document.getElementById('cutBar');
  if (bar) bar.style.display = 'flex';
  const btn = document.getElementById('btnCutBrush');
  if (btn) btn.classList.remove('brush-on');
  updateCutStatus();
  render();
  detectCutLinesAsync();
}

function exitCutMode(cancelled) {
  cutState.active = false;
  cutState.stickerId = null;
  cutState.region = null;
  cutState.autoWall = null;
  cutState.manualWall = null;
  cutState.regionAlpha = null;
  cutState.stickerBox = null;
  cutState.overlay = null;
  cutState.brush = false;
  cutState.brushActive = false;
  cutState.lastPoint = null;
  cutState.analyzing = false;
  const bar = document.getElementById('cutBar');
  if (bar) bar.style.display = 'none';
  canvas.style.cursor = 'crosshair';
  if (cancelled) showToast('已取消切割');
  render();
}

function cancelCutMode() {
  if (cutState.active) exitCutMode(true);
}

// ---- line detection (pure functions, region-sized) ----
function otsuThreshold(hist) {
  const total = hist.reduce((a, b) => a + b, 0);
  if (total === 0) return 128;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, maxVar = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (wB === 0) continue;
    const wF = total - wB;
    if (wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * (mB - mF) * (mB - mF);
    if (v > maxVar) { maxVar = v; thr = t; }
  }
  return thr;
}

function dilateWall(wall, w, h) {
  const out = new Uint8Array(wall.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (wall[y * w + x]) {
      if (x > 0) out[y * w + x - 1] = 1;
      if (x < w - 1) out[y * w + x + 1] = 1;
      if (y > 0) out[(y - 1) * w + x] = 1;
      if (y < h - 1) out[(y + 1) * w + x] = 1;
    }
  }
  for (let i = 0; i < wall.length; i++) if (out[i]) wall[i] = 1;
}

function buildLineMask(bg, region) {
  const s = Math.max(1, Math.ceil(Math.max(region.w, region.h) / CUT_MAXWORK));
  const rw = Math.max(3, Math.floor(region.w / s));
  const rh = Math.max(3, Math.floor(region.h / s));
  const d = bg.data, W = bg.width;
  const lum = new Float32Array(rw * rh);
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) {
    const i = ((region.y + y * s) * W + (region.x + x * s)) * 4;
    lum[y * rw + x] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  }
  const mag = new Float32Array(rw * rh), hist = new Uint32Array(256);
  for (let y = 1; y < rh - 1; y++) for (let x = 1; x < rw - 1; x++) {
    const p = y * rw + x;
    const gx = (lum[p - rw - 1] + 2 * lum[p - 1] + lum[p + rw - 1])
             - (lum[p - rw + 1] + 2 * lum[p + 1] + lum[p + rw + 1]);
    const gy = (lum[p - rw - 1] + 2 * lum[p - rw] + lum[p - rw + 1])
             - (lum[p + rw - 1] + 2 * lum[p + rw] + lum[p + rw + 1]);
    const m = Math.min(255, Math.abs(gx) + Math.abs(gy));
    mag[p] = m; hist[m | 0]++;
  }
  const otsu = otsuThreshold(hist);
  const k = (detectedStyle && detectedStyle.style === 'sketch') ? 0.35 : 0.55;
  const thr = Math.max(otsu * k, 30);
  const wall = new Uint8Array(region.w * region.h);
  for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) {
    if (mag[y * rw + x] > thr) {
      for (let dy = 0; dy < s && y * s + dy < region.h; dy++)
        for (let dx = 0; dx < s && x * s + dx < region.w; dx++)
          wall[(y * s + dy) * region.w + (x * s + dx)] = 1;
    }
  }
  dilateWall(wall, region.w, region.h);
  return wall;
}

function detectCutLinesAsync() {
  const myId = cutState.stickerId;
  const myRegion = { x: cutState.region.x, y: cutState.region.y, w: cutState.region.w, h: cutState.region.h };
  setTimeout(() => {
    if (!cutState.active || cutState.stickerId !== myId) return;
    let wall = null;
    if (bgImageData) {
      try { wall = buildLineMask(bgImageData, myRegion); } catch (err) { wall = null; }
    }
    if (!cutState.active || cutState.stickerId !== myId) return;
    cutState.autoWall = wall;
    cutState.analyzing = false;
    rebuildCutOverlay();
    updateCutStatus();
    render();
    const hasAuto = wall && wall.some(v => v === 1);
    if (!hasAuto && bgImageData) {
      cutState.brush = true;
      const btn = document.getElementById('btnCutBrush');
      if (btn) btn.classList.add('brush-on');
      showToast('未识别到底图线条，已开启画笔，请手动画线');
    }
  }, 0);
}

// ---- rasterise + flood-fill + extract ----
function rasterizeStickerToCanvas(sticker, region) {
  const tc = document.createElement('canvas');
  tc.width = region.w; tc.height = region.h;
  const c = tc.getContext('2d');
  c.translate(sticker.x - region.x, sticker.y - region.y);
  const sx = sticker.flipH ? -1 : 1, sy = sticker.flipV ? -1 : 1;
  c.rotate(sticker.rotation * Math.PI / 180);
  c.scale(sx, sy);
  c.globalAlpha = sticker.opacity;
  c.drawImage(sticker.adjustedImage || sticker.image,
              -sticker.width / 2, -sticker.height / 2, sticker.width, sticker.height);
  return tc;
}

function floodFillComponents(alpha, wall, w, h, minPixels) {
  const N = w * h, label = new Int32Array(N), stack = new Int32Array(N);
  const comps = [];
  let compId = 0;
  for (let i = 0; i < N; i++) {
    if (label[i] || wall[i] === 1 || alpha[i * 4 + 3] < ALPHA_MIN) continue;
    let sp = 0; stack[sp++] = i; label[i] = ++compId;
    let count = 0, minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    while (sp > 0) {
      const p = stack[--sp], px = p % w, py = (p / w) | 0;
      count++;
      if (px < minX) minX = px; if (px > maxX) maxX = px;
      if (py < minY) minY = py; if (py > maxY) maxY = py;
      if (px > 0)   { const q = p - 1;     if (!label[q] && wall[q] !== 1 && alpha[q * 4 + 3] >= ALPHA_MIN) { label[q] = compId; stack[sp++] = q; } }
      if (px < w - 1) { const q = p + 1;   if (!label[q] && wall[q] !== 1 && alpha[q * 4 + 3] >= ALPHA_MIN) { label[q] = compId; stack[sp++] = q; } }
      if (py > 0)   { const q = p - w;     if (!label[q] && wall[q] !== 1 && alpha[q * 4 + 3] >= ALPHA_MIN) { label[q] = compId; stack[sp++] = q; } }
      if (py < h - 1) { const q = p + w;   if (!label[q] && wall[q] !== 1 && alpha[q * 4 + 3] >= ALPHA_MIN) { label[q] = compId; stack[sp++] = q; } }
    }
    if (count >= minPixels) comps.push({ id: compId, count: count, minX: minX, minY: minY, maxX: maxX, maxY: maxY });
  }
  return { label, comps };
}

// Drop "thin frame" components: a ring hugging all four edges of the sticker with
// very little fill. These appear when a background line happens to align with the
// sticker's own edge; they are artifacts, not real pieces.
function filterCutComponents(comps, stickerBox) {
  if (!comps.length || !stickerBox) return comps;
  return comps.filter(c => {
    const touchesLeft = c.minX <= stickerBox.minX + 3;
    const touchesRight = c.maxX >= stickerBox.maxX - 3;
    const touchesTop = c.minY <= stickerBox.minY + 3;
    const touchesBottom = c.maxY >= stickerBox.maxY - 3;
    const bw = c.maxX - c.minX + 1, bh = c.maxY - c.minY + 1;
    const fillRatio = c.count / (bw * bh);
    return !(touchesLeft && touchesRight && touchesTop && touchesBottom && fillRatio < 0.2);
  });
}

function extractPieceAsDataUrl(tempCanvas, region, comp, label) {
  const bw = comp.maxX - comp.minX + 1, bh = comp.maxY - comp.minY + 1;
  const mask = document.createElement('canvas'); mask.width = bw; mask.height = bh;
  const mctx = mask.getContext('2d');
  const md = mctx.createImageData(bw, bh);
  const mdd = md.data;
  for (let y = comp.minY; y <= comp.maxY; y++) for (let x = comp.minX; x <= comp.maxX; x++) {
    if (label[y * region.w + x] === comp.id) {
      const o = ((y - comp.minY) * bw + (x - comp.minX)) * 4;
      mdd[o] = mdd[o + 1] = mdd[o + 2] = mdd[o + 3] = 255;
    }
  }
  mctx.putImageData(md, 0, 0);

  const piece = document.createElement('canvas'); piece.width = bw; piece.height = bh;
  const pc = piece.getContext('2d');
  pc.drawImage(tempCanvas, comp.minX, comp.minY, bw, bh, 0, 0, bw, bh);
  pc.globalCompositeOperation = 'destination-in';
  pc.drawImage(mask, 0, 0);
  return piece.toDataURL('image/png');
}

// ---- walls & overlay ----
function unionWallMask() {
  const r = cutState.region;
  const w = new Uint8Array(r.w * r.h);
  const aw = cutState.autoWall || [];
  for (let i = 0; i < w.length; i++) if (aw[i]) w[i] = 1;
  const mw = cutState.manualWall;
  if (mw) {
    const W = canvas.width;
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
      const px = r.x + x, py = r.y + y;
      if (px >= 0 && py >= 0 && px < W && py < canvas.height && mw[py * W + px]) w[y * r.w + x] = 1;
    }
  }
  return w;
}

function rebuildCutOverlay() {
  if (!cutState.overlay) return;
  const octx = cutState.overlay.getContext('2d');
  const img = octx.createImageData(canvas.width, canvas.height);
  const d = img.data;
  const r = cutState.region;
  if (cutState.autoWall) {
    for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
      if (cutState.autoWall[y * r.w + x]) {
        const o = ((r.y + y) * canvas.width + (r.x + x)) * 4;
        d[o] = 255; d[o + 1] = 80; d[o + 2] = 80; d[o + 3] = 140;
      }
    }
  }
  if (cutState.manualWall) {
    for (let i = 0; i < cutState.manualWall.length; i++) {
      if (cutState.manualWall[i]) {
        const o = i * 4;
        d[o] = 0; d[o + 1] = 220; d[o + 2] = 255; d[o + 3] = 200;
      }
    }
  }
  octx.putImageData(img, 0, 0);
}

function previewCutComponents() {
  const r = cutState.region;
  if (!cutState.regionAlpha || !r) return 0;
  const wall = unionWallMask();
  const res = floodFillComponents(cutState.regionAlpha, wall, r.w, r.h, MIN_PIXELS);
  return filterCutComponents(res.comps, cutState.stickerBox).length;
}

function updateCutStatus() {
  const el = document.getElementById('cutStatus');
  if (!el) return;
  if (cutState.analyzing) { el.textContent = '识别中…'; return; }
  const n = previewCutComponents();
  const manual = cutState.manualWall && cutState.manualWall.some(v => v === 1);
  if (n <= 0) {
    el.textContent = manual ? '未形成独立区域，请继续补画线条' : '未识别到底图线条，可点 🖊 画线';
  } else if (n > MAX_PIECES) {
    el.textContent = '将切成 ' + n + ' 块（过多），请加粗/补画线条分隔';
  } else {
    el.textContent = '将切成 ' + n + ' 块';
  }
}

// ---- manual brush ----
function toggleCutBrush() {
  if (!cutState.active) return;
  cutState.brush = !cutState.brush;
  const btn = document.getElementById('btnCutBrush');
  if (btn) btn.classList.toggle('brush-on', cutState.brush);
  canvas.style.cursor = cutState.brush ? 'crosshair' : 'default';
  showToast(cutState.brush ? '🖊 画笔已开启，在贴图上画切割线' : '画笔已关闭');
}

function clearManualLines() {
  if (!cutState.active) return;
  if (cutState.manualWall) cutState.manualWall.fill(0);
  rebuildCutOverlay();
  updateCutStatus();
  render();
}

function brushRadius(e) {
  return (e && e._isTouch) ? BRUSH_R_TOUCH : BRUSH_R;
}

function startManualStroke(pos, e) {
  cutState.brushActive = true;
  cutState.lastPoint = pos;
  const r = brushRadius(e);
  stampCircle(pos.x, pos.y, r);
  stampOverlayDot(pos.x, pos.y, r);
}

function extendManualStroke(pos, e) {
  if (!cutState.brushActive || !cutState.lastPoint) return;
  const r = brushRadius(e);
  stampLine(cutState.lastPoint.x, cutState.lastPoint.y, pos.x, pos.y, r);
  strokeOverlayLine(cutState.lastPoint.x, cutState.lastPoint.y, pos.x, pos.y, r);
  cutState.lastPoint = pos;
  render();
}

function endManualStroke() {
  cutState.brushActive = false;
  cutState.lastPoint = null;
  updateCutStatus();
}

function stampLine(x0, y0, x1, y1, r) {
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.max(1, Math.round(Math.hypot(dx, dy)));
  for (let t = 0; t <= dist; t++) {
    stampCircle(Math.round(x0 + dx * t / dist), Math.round(y0 + dy * t / dist), r);
  }
}

function stampCircle(cx, cy, r) {
  const mw = cutState.manualWall;
  const W = canvas.width, H = canvas.height;
  if (!mw) return;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (dx * dx + dy * dy <= r * r) {
      const x = cx + dx, y = cy + dy;
      if (x >= 0 && y >= 0 && x < W && y < H) mw[y * W + x] = 1;
    }
  }
}

function stampOverlayDot(x, y, r) {
  if (!cutState.overlay) return;
  const o = cutState.overlay.getContext('2d');
  o.fillStyle = 'rgba(0,220,255,0.85)';
  o.beginPath();
  o.arc(x, y, r, 0, Math.PI * 2);
  o.fill();
}

function strokeOverlayLine(x0, y0, x1, y1, r) {
  if (!cutState.overlay) return;
  const o = cutState.overlay.getContext('2d');
  o.strokeStyle = 'rgba(0,220,255,0.85)';
  o.lineWidth = r * 2;
  o.lineCap = 'round';
  o.beginPath();
  o.moveTo(x0, y0);
  o.lineTo(x1, y1);
  o.stroke();
}

// ---- apply cut ----
function applyCut() {
  if (!cutState.active) return;
  const r = cutState.region;
  if (!r || !cutState.regionAlpha) return;
  const wall = unionWallMask();
  const res = floodFillComponents(cutState.regionAlpha, wall, r.w, r.h, MIN_PIXELS);
  const comps = filterCutComponents(res.comps, cutState.stickerBox);
  if (comps.length === 0) {
    showToast('未形成独立区域，请画线分隔后再试');
    return;
  }
  if (comps.length > MAX_PIECES) {
    showToast('块数过多(' + comps.length + ')，请画更多线条细分');
    return;
  }
  const sticker = stickers.find(s => s.id === cutState.stickerId);
  if (!sticker) return;
  const temp = rasterizeStickerToCanvas(sticker, r);
  const idx = stickers.indexOf(sticker);

  const promises = comps.map(comp => {
    const url = extractPieceAsDataUrl(temp, r, comp, res.label);
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ img, comp });
      img.onerror = () => resolve(null);
      img.src = url;
    });
  });

  Promise.all(promises).then(results => {
    if (!cutState.active) return;
    const pieces = results.filter(Boolean).map(({ img, comp }) => ({
      id: 'sticker_' + (++stickerIdCounter),
      type: 'image',
      image: img,
      originalImage: img,
      x: r.x + (comp.minX + comp.maxX + 1) / 2,
      y: r.y + (comp.minY + comp.maxY + 1) / 2,
      width: comp.maxX - comp.minX + 1,
      height: comp.maxY - comp.minY + 1,
      rotation: 0,
      opacity: 1,
      flipH: false,
      flipV: false,
      shadowEnabled: false,
      shadowCanvas: null,
      shadowOffsetX: 0, shadowOffsetY: 0, shadowOpacity: 0.3,
      adjustedImage: null,
      adjustments: null,
    }));
    if (pieces.length === 0) {
      showToast('未切出任何有效块');
      exitCutMode(false);
      return;
    }
    commitCut(idx, pieces);
  });
}

function commitCut(idx, pieces) {
  saveUndo();
  stickers.splice(idx, 1, ...pieces);
  let best = pieces[0];
  for (const p of pieces) if (p.width * p.height > best.width * best.height) best = p;
  exitCutMode(false);
  selectSticker(best.id);
  showToast('✂ 已切成 ' + pieces.length + ' 块');
  render();
}

// ==================== BACKGROUND REMOVAL (去背景) ====================
// Magic-wand background removal: tap a background pixel, the connected region of
// similar colour is flooded and made transparent. Works on any solid-ish bg.
let bgrmState = null; // { imgCanvas, imgData, w, h, work, removed, seeds, cropUrl, cropSize }
const BGRM_MAX = 1024; // cap processing resolution for speed

function openBgrm() {
  if (!selectedId) return;
  const sticker = stickers.find(s => s.id === selectedId);
  if (!sticker) return;
  const src = sticker.adjustedImage || sticker.image;
  if (!src) return;

  let w = src.naturalWidth, h = src.naturalHeight;
  const sc = Math.min(1, BGRM_MAX / Math.max(w, h));
  w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));

  const imgCanvas = document.createElement('canvas');
  imgCanvas.width = w; imgCanvas.height = h;
  const ictx = imgCanvas.getContext('2d');
  ictx.drawImage(src, 0, 0, w, h);

  // checkerboard background (so transparency shows) at image resolution
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = w; bgCanvas.height = h;
  const bctx = bgCanvas.getContext('2d');
  const pat = document.createElement('canvas'); pat.width = 16; pat.height = 16;
  const pctx = pat.getContext('2d');
  pctx.fillStyle = '#ffffff'; pctx.fillRect(0, 0, 16, 16);
  pctx.fillStyle = '#e2e8f0'; pctx.fillRect(0, 0, 8, 8); pctx.fillRect(8, 8, 8, 8);
  bctx.fillStyle = bctx.createPattern(pat, 'repeat');
  bctx.fillRect(0, 0, w, h);

  bgrmState = {
    imgCanvas: imgCanvas,
    imgData: ictx.getImageData(0, 0, w, h),
    w: w, h: h,
    work: null,
    removed: new Uint8Array(w * h),
    baseRemoved: new Uint8Array(w * h), // AI result; manual taps refine on top
    seeds: [],
    edge: null,
    cropUrl: null,
    cropSize: null,
    bgCanvas: bgCanvas,
    zoom: 1,
    panX: 0,
    panY: 0,
    pointer: null,
  };
  document.getElementById('bgrmModal').style.display = 'flex';
  document.getElementById('bgrmZoomVal').textContent = '1×';
  document.getElementById('bgrmHint').textContent = '👆 点击背景手动微调，或点上方 🤖 AI 一键抠图';
  bgrmState.edge = buildBgrmEdgeMap();
  rebuildBgrm();
  updateBgrmButtons();
  redrawBgrmPreview();
}

function closeBgrm() {
  document.getElementById('bgrmModal').style.display = 'none';
  bgrmState = null;
}

function bgrmTapPos(e) {
  const st = bgrmState;
  const canvas = document.getElementById('bgrmCanvas');
  const rect = canvas.getBoundingClientRect();
  const tx = (e.clientX - rect.left) / rect.width * st.w;
  const ty = (e.clientY - rect.top) / rect.height * st.h;
  const z = st.zoom || 1;
  const x = Math.round((st.panX || 0) + tx / z);
  const y = Math.round((st.panY || 0) + ty / z);
  return { x: Math.max(0, Math.min(st.w - 1, x)), y: Math.max(0, Math.min(st.h - 1, y)) };
}

function bgrmColorClose(idx, r, g, b, tol) {
  const d = bgrmState.imgData.data;
  if (d[idx + 3] < 8) return false; // transparent pixels act as barriers
  const dr = d[idx] - r, dg = d[idx + 1] - g, db = d[idx + 2] - b;
  return dr * dr + dg * dg + db * db <= tol * tol;
}

function bgrmEdgeThreshold() {
  // higher 容差 → lower threshold → snaps to finer/weaker lines
  const tol = parseInt(document.getElementById('bgrmTolerance').value, 10);
  return Math.max(0, 220 - tol);
}

// 吸附线条 mode: flood stops at strong edges, so the boundary snaps to the
// object's outline and the region inside it (the sticker) is never removed.
// 颜色 mode: flood stops at colour difference from the tapped seed (magic wand).
function floodRemoveBg(seedX, seedY) {
  const st = bgrmState;
  const data = st.imgData.data;
  const w = st.w, h = st.h;
  const start = seedY * w + seedX;
  if (st.removed[start]) return;
  const isLine = st.mode === 'line';
  const tol = parseInt(document.getElementById('bgrmTolerance').value, 10);
  const edgeT = isLine ? bgrmEdgeThreshold() : 0;
  if (isLine && (data[start * 4 + 3] < 8 || st.edge[start] >= edgeT)) return; // seed is edge/transparent (object) — don't remove
  const sr = data[start * 4], sg = data[start * 4 + 1], sb = data[start * 4 + 2];
  const stack = [start];
  st.removed[start] = 1;
  const edge = st.edge;
  while (stack.length) {
    const p = stack.pop();
    const px = p % w, py = (p / w) | 0;
    if (px > 0)     { const q = p - 1;     if (!st.removed[q] && (isLine ? (data[q * 4 + 3] >= 8 && edge[q] < edgeT) : bgrmColorClose(q * 4, sr, sg, sb, tol))) { st.removed[q] = 1; stack.push(q); } }
    if (px < w - 1) { const q = p + 1;     if (!st.removed[q] && (isLine ? (data[q * 4 + 3] >= 8 && edge[q] < edgeT) : bgrmColorClose(q * 4, sr, sg, sb, tol))) { st.removed[q] = 1; stack.push(q); } }
    if (py > 0)     { const q = p - w;     if (!st.removed[q] && (isLine ? (data[q * 4 + 3] >= 8 && edge[q] < edgeT) : bgrmColorClose(q * 4, sr, sg, sb, tol))) { st.removed[q] = 1; stack.push(q); } }
    if (py < h - 1) { const q = p + w;     if (!st.removed[q] && (isLine ? (data[q * 4 + 3] >= 8 && edge[q] < edgeT) : bgrmColorClose(q * 4, sr, sg, sb, tol))) { st.removed[q] = 1; stack.push(q); } }
  }
}

function buildBgrmEdgeMap() {
  const st = bgrmState;
  const d = st.imgData.data;
  const w = st.w, h = st.h;
  const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) lum[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  const edge = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const p = y * w + x;
    const gx = (lum[p - w - 1] + 2 * lum[p - 1] + lum[p + w - 1]) - (lum[p - w + 1] + 2 * lum[p + 1] + lum[p + w + 1]);
    const gy = (lum[p - w - 1] + 2 * lum[p - w] + lum[p - w + 1]) - (lum[p + w - 1] + 2 * lum[p + w] + lum[p + w + 1]);
    edge[p] = Math.abs(gx) + Math.abs(gy);
  }
  return edge;
}

// 吸附线条 mode: auto-flood from the four corners (usually background), snapping
// to the object's edges. Manual taps add more seeds.
function runAllBgrmSeeds() {
  const st = bgrmState;
  if (!st) return;
  // rebuild the mask: AI base result + manual refinement seeds (undo only reverts the last seed)
  st.removed.set(st.baseRemoved);
  for (const s of st.seeds) floodRemoveBg(s.x, s.y);
  rebuildBgrm();
  redrawBgrmPreview();
}

function rebuildBgrm() {
  const st = bgrmState;
  if (!st) return;
  if (!st.work) { st.work = document.createElement('canvas'); st.work.width = st.w; st.work.height = st.h; }
  const wctx = st.work.getContext('2d');
  const img = wctx.createImageData(st.w, st.h);
  const out = img.data;
  const src = st.imgData.data;
  for (let i = 0; i < st.w * st.h; i++) {
    const o = i * 4;
    out[o] = src[o]; out[o + 1] = src[o + 1]; out[o + 2] = src[o + 2];
    out[o + 3] = st.removed[i] ? 0 : src[o + 3];
  }
  wctx.putImageData(img, 0, 0);
  st.cropUrl = null; st.cropSize = null;
}

function clampBgrmPan(st) {
  const visW = st.w / st.zoom, visH = st.h / st.zoom;
  st.panX = Math.max(0, Math.min(st.w - visW, st.panX || 0));
  st.panY = Math.max(0, Math.min(st.h - visH, st.panY || 0));
}

function redrawBgrmPreview() {
  const st = bgrmState;
  if (!st) return;
  const canvas = document.getElementById('bgrmCanvas');
  canvas.width = st.w; canvas.height = st.h;
  const ctx = canvas.getContext('2d');
  const z = st.zoom || 1;
  const visW = st.w / z, visH = st.h / z;
  const px = st.panX || 0, py = st.panY || 0;
  // checkerboard background, then the processed image (same region, so transparency shows)
  ctx.drawImage(st.bgCanvas, px, py, visW, visH, 0, 0, st.w, st.h);
  ctx.drawImage(st.work || st.imgCanvas, px, py, visW, visH, 0, 0, st.w, st.h);
}

function bgrmPointerDown(e) {
  if (!bgrmState) return;
  e.preventDefault();
  bgrmState.pointer = {
    sx: e.clientX, sy: e.clientY,
    panX: bgrmState.panX, panY: bgrmState.panY,
    moved: false,
  };
  try { document.getElementById('bgrmCanvas').setPointerCapture(e.pointerId); } catch (err) {}
}

function bgrmPointerMove(e) {
  const st = bgrmState;
  if (!st || !st.pointer) return;
  e.preventDefault();
  const dx = e.clientX - st.pointer.sx;
  const dy = e.clientY - st.pointer.sy;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) st.pointer.moved = true;
  if (st.zoom > 1) {
    const rect = document.getElementById('bgrmCanvas').getBoundingClientRect();
    const imgPerPx = st.w / (st.zoom * rect.width); // image px per screen px
    st.panX = st.pointer.panX - dx * imgPerPx;
    st.panY = st.pointer.panY - dy * imgPerPx;
    clampBgrmPan(st);
    redrawBgrmPreview();
  }
}

function bgrmPointerUp(e) {
  const st = bgrmState;
  if (!st || !st.pointer) return;
  const moved = st.pointer.moved;
  st.pointer = null;
  if (moved) return; // it was a pan, not a tap
  // a tap → manual fine-tune: remove the connected background colour at that spot
  const { x, y } = bgrmTapPos(e);
  st.seeds.push({ x: x, y: y });
  floodRemoveBg(x, y);
  rebuildBgrm();
  redrawBgrmPreview();
  document.getElementById('bgrmHint').textContent = st.zoom > 1
    ? '放大中：拖动画布查看 · 点击背景微调'
    : '继续点击可删除更多 · 调容差可重新微调';
  updateBgrmButtons();
}

function bgrmZoom(factor) {
  const st = bgrmState;
  if (!st) return;
  const oldZ = st.zoom;
  const newZ = Math.max(1, Math.min(4, oldZ * factor));
  if (newZ === oldZ) return;
  // keep the view centre stable
  const cx = (st.panX || 0) + st.w / oldZ / 2;
  const cy = (st.panY || 0) + st.h / oldZ / 2;
  st.zoom = newZ;
  st.panX = cx - st.w / newZ / 2;
  st.panY = cy - st.h / newZ / 2;
  clampBgrmPan(st);
  document.getElementById('bgrmZoomVal').textContent = newZ + '×';
  document.getElementById('bgrmHint').textContent = newZ > 1
    ? '放大中：拖动画布查看 · 点击背景微调'
    : '👆 点击背景手动微调，或点上方 🤖 AI 一键抠图';
  redrawBgrmPreview();
}

function undoBgrm() {
  const st = bgrmState;
  if (!st) return;
  // revert only the last manual fine-tune tap; the AI base result stays
  if (!st.seeds.length) {
    showToast('已回到 AI 抠图结果');
    return;
  }
  st.seeds.pop();
  runAllBgrmSeeds();
  updateBgrmButtons();
}

function updateBgrmButtons() {
  const has = bgrmState && bgrmState.removed.some(v => v === 1);
  const u = document.getElementById('btnBgrmUndo');
  const a = document.getElementById('btnBgrmApply');
  const s = document.getElementById('btnBgrmSave');
  if (u) u.disabled = !has;
  if (a) a.disabled = !has;
  if (s) s.disabled = !has;
}

function onBgrmTolChange() {
  const el = document.getElementById('bgrmTolerance');
  document.getElementById('bgrmTolVal').textContent = el.value;
  if (!bgrmState) return;
  runAllBgrmSeeds(); // re-run manual fine-tune seeds on top of the AI base
}

// ==================== AI BACKGROUND REMOVAL (U2NET) ====================
// One-tap AI cutout: runs u2netp.onnx in the browser (onnxruntime-web, WASM),
// fills the removal mask from the model's foreground probability map. Works well
// on soft/fading edges that manual tools struggle with.
let aiSession = null;
let aiEngineLoaded = false;
const AI_ORT_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.min.js';
const AI_MODEL_URL = 'u2netp.onnx';
const AI_WASM_URL = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort-wasm-simd-threaded.wasm';
const AI_JSEP_MJS = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort-wasm-simd-threaded.jsep.mjs';
const AI_JSEP_WASM = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort-wasm-simd-threaded.jsep.wasm';
const U2NET_MEAN = [0.485, 0.456, 0.406];
const U2NET_STD = [0.229, 0.224, 0.225];

let aiProgressLabel = '';

function showAiProgress(show, text) {
  aiProgressLabel = text || '';
  const p = document.getElementById('aiProgress');
  if (!p) return;
  p.style.display = show ? 'block' : 'none';
  document.getElementById('aiProgressText').textContent = aiProgressLabel;
  if (!show) document.getElementById('aiProgressFill').style.width = '0%';
}

function updateAiProgress(pct) {
  // clamp to 0..100% (GitHub Pages may compress, making loaded > content-length)
  const p = Math.max(0, Math.min(1, pct));
  document.getElementById('aiProgressFill').style.width = Math.round(p * 100) + '%';
  document.getElementById('aiProgressText').textContent = aiProgressLabel + ' ' + Math.round(p * 100) + '%';
}

async function fetchWithProgress(url, onProgress) {
  if (onProgress) onProgress(0); // reset the bar for this file
  const res = await fetch(url);
  if (!res.ok) throw new Error('下载失败(' + res.status + ')');
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let loaded = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.length;
    if (onProgress && total) onProgress(loaded / total);
  }
  const blob = new Blob(chunks);
  return new Uint8Array(await blob.arrayBuffer());
}

function loadOrt() {
  return new Promise((resolve, reject) => {
    if (window.ort) return resolve(window.ort);
    const s = document.createElement('script');
    s.src = AI_ORT_URL;
    s.onload = () => {
      if (window.ort) {
        window.ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/';
        resolve(window.ort);
      } else reject(new Error('AI 引擎加载异常'));
    };
    s.onerror = () => reject(new Error('无法加载 AI 引擎，请检查网络'));
    document.head.appendChild(s);
  });
}

function buildU2netInput(imgCanvas) {
  const c = document.createElement('canvas');
  c.width = 320; c.height = 320;
  c.getContext('2d').drawImage(imgCanvas, 0, 0, 320, 320);
  const d = c.getContext('2d').getImageData(0, 0, 320, 320).data;
  const pixels = new Float32Array(1 * 3 * 320 * 320);
  for (let i = 0; i < 320 * 320; i++) {
    pixels[i] = (d[i * 4] / 255 - U2NET_MEAN[0]) / U2NET_STD[0];
    pixels[320 * 320 + i] = (d[i * 4 + 1] / 255 - U2NET_MEAN[1]) / U2NET_STD[1];
    pixels[2 * 320 * 320 + i] = (d[i * 4 + 2] / 255 - U2NET_MEAN[2]) / U2NET_STD[2];
  }
  return new window.ort.Tensor('float32', pixels, [1, 3, 320, 320]);
}

function resizeU2netMask(maskData, srcW, srcH, dstW, dstH) {
  const src = document.createElement('canvas'); src.width = srcW; src.height = srcH;
  const sctx = src.getContext('2d');
  const img = sctx.createImageData(srcW, srcH);
  for (let i = 0; i < srcW * srcH; i++) {
    const v = Math.round(maskData[i] * 255);
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  sctx.putImageData(img, 0, 0);
  const dst = document.createElement('canvas'); dst.width = dstW; dst.height = dstH;
  dst.getContext('2d').drawImage(src, 0, 0, dstW, dstH);
  const out = dst.getContext('2d').getImageData(0, 0, dstW, dstH).data;
  const resized = new Float32Array(dstW * dstH);
  for (let i = 0; i < dstW * dstH; i++) resized[i] = out[i * 4] / 255;
  return resized;
}

async function aiCutout() {
  const st = bgrmState;
  if (!st) return;
  const hint = document.getElementById('bgrmHint');
  hint.textContent = aiSession ? '🤖 AI 抠图中…' : '🤖 AI 抠图中…（首次需下载约12MB，请稍等）';
  try {
    const ort = await loadOrt();
    if (!aiSession) {
      if (!aiEngineLoaded) {
        // pre-download engine files (shows progress, warms browser cache)
        showAiProgress(true, '下载 AI 引擎 1/2（约40MB，仅首次）');
        await fetchWithProgress(AI_WASM_URL, updateAiProgress);
        showAiProgress(true, '下载 AI 引擎 2/2');
        await fetchWithProgress(AI_JSEP_WASM, updateAiProgress);
        await fetch(AI_JSEP_MJS);
        aiEngineLoaded = true;
      }
      showAiProgress(true, '下载 AI 模型…');
      await fetchWithProgress(AI_MODEL_URL, updateAiProgress);
      aiSession = await ort.InferenceSession.create(AI_MODEL_URL, { executionProviders: ['wasm'] });
      showAiProgress(false);
    }
    hint.textContent = '🤖 AI 抠图中…';
    const out = await aiSession.run({ 'input.1': buildU2netInput(st.imgCanvas) });
    const mask = out['1959'] || out[Object.keys(out)[0]];
    const resized = resizeU2netMask(mask.data, 320, 320, st.w, st.h);
    // AI result becomes the base; manual taps refine on top and undo keeps it
    st.baseRemoved.fill(0);
    for (let i = 0; i < st.w * st.h; i++) if (resized[i] < 0.5) st.baseRemoved[i] = 1;
    st.seeds = [];
    st.removed.set(st.baseRemoved);
    rebuildBgrm();
    redrawBgrmPreview();
    updateBgrmButtons();
    hint.textContent = '🤖 已抠图，可点背景手动微调，或应用/存库';
  } catch (e) {
    console.error(e);
    showAiProgress(false);
    hint.textContent = '🤖 AI 抠图失败：' + (e.message || e);
  }
}

function getBgrmCropUrl() {
  const st = bgrmState;
  if (!st) return null;
  if (st.cropUrl) return st.cropUrl;
  const wctx = st.work.getContext('2d');
  const data = wctx.getImageData(0, 0, st.w, st.h).data;
  let minX = st.w, minY = st.h, maxX = -1, maxY = -1;
  for (let y = 0; y < st.h; y++) for (let x = 0; x < st.w; x++) {
    if (data[(y * st.w + x) * 4 + 3] > 8) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) return null;
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const crop = document.createElement('canvas');
  crop.width = bw; crop.height = bh;
  crop.getContext('2d').drawImage(st.work, minX, minY, bw, bh, 0, 0, bw, bh);
  st.cropUrl = crop.toDataURL('image/png');
  st.cropSize = { w: bw, h: bh };
  return st.cropUrl;
}

function applyBgrm() {
  const url = getBgrmCropUrl();
  if (!url) { showToast('⚠️ 没抠出内容，请先点背景'); return; }
  const sticker = stickers.find(s => s.id === selectedId);
  if (!sticker) return;
  const img = new Image();
  img.onload = () => {
    const ratio = bgrmState.cropSize.h / bgrmState.cropSize.w;
    sticker.image = img;
    sticker.originalImage = img;
    if (!sticker.width) sticker.width = 100;
    sticker.height = Math.round(sticker.width * ratio);
    sticker.adjustedImage = null;
    sticker.adjustments = null;
    sticker.shadowEnabled = false;
    sticker.shadowCanvas = null;
    render();
    document.getElementById('bgrmHint').textContent = '✅ 已应用，可继续存贴图库或点取消';
    showToast('✅ 已去背景');
  };
  img.src = url;
}

function saveBgrmToLibrary() {
  const url = getBgrmCropUrl();
  if (!url) { showToast('⚠️ 没抠出内容'); return; }
  resizeImageDataUrl(url, 400, (dataUrl400) => {
    resizeImageDataUrl(dataUrl400, 128, (thumb128) => {
      const id = 'custom_' + Date.now();
      const name = '抠图贴纸 ' + new Date().toLocaleTimeString();
      customStickers.push({ id: id, name: name, dataUrl: dataUrl400, thumb: thumb128 });
      saveCustomStickers();
      renderCustomStickerGrid();
      showToast('✅ 已存入贴图库');
    });
  });
}

// ==================== EXPORT ====================
function downloadResult() {
  if (!bgImage && stickers.length === 0) {
    showToast('⚠️ 画布为空，请先添加内容');
    return;
  }

  const format = document.getElementById('exportFormat').value;
  const quality = parseInt(document.getElementById('exportQuality').value) / 100;
  let mimeType, ext;
  if (format === 'jpeg') { mimeType = 'image/jpeg'; ext = 'jpg'; }
  else if (format === 'webp') { mimeType = 'image/webp'; ext = 'webp'; }
  else { mimeType = 'image/png'; ext = 'png'; }

  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;
  const exportCtx = exportCanvas.getContext('2d');

  // JPEG/WebP need opaque background; fill white first if no bgImage
  const needsOpaqueBg = (format === 'jpeg') && !bgImage;
  if (needsOpaqueBg) {
    exportCtx.fillStyle = '#ffffff';
    exportCtx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw background
  if (bgImage) {
    exportCtx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  } else if (format === 'png') {
    exportCtx.fillStyle = '#ffffff';
    exportCtx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw stickers (back to front)
  for (const sticker of stickers) {
    exportCtx.save();
    exportCtx.translate(sticker.x, sticker.y);
    const img = sticker.adjustedImage || sticker.image;
    const w = sticker.width, h = sticker.height;
    const sx = sticker.flipH ? -1 : 1;
    const sy = sticker.flipV ? -1 : 1;

    if (sticker.shadowEnabled && sticker.shadowCanvas) {
      exportCtx.save();
      exportCtx.globalAlpha = (sticker.shadowOpacity || 0.3) * sticker.opacity * 0.8;
      exportCtx.translate(sticker.shadowOffsetX || 0, sticker.shadowOffsetY || 0);
      exportCtx.rotate(sticker.rotation * Math.PI / 180);
      exportCtx.scale(sx, sy);
      const sCanvas = sticker.shadowCanvas;
      exportCtx.drawImage(sCanvas, -sCanvas.width/2, -sCanvas.height/2, sCanvas.width, sCanvas.height);
      exportCtx.restore();
    }

    exportCtx.rotate(sticker.rotation * Math.PI / 180);
    exportCtx.scale(sx, sy);
    exportCtx.globalAlpha = sticker.opacity;
    exportCtx.drawImage(img, -w/2, -h/2, w, h);
    exportCtx.restore();
  }

  // Download
  exportCanvas.toBlob((blob) => {
    if (!blob) { showToast('❌ 导出失败'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'composite_' + Date.now() + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const sizeKB = (blob.size / 1024).toFixed(0);
    showToast('✅ ' + ext.toUpperCase() + ' ' + sizeKB + 'KB 已下载');
  }, mimeType, quality);
}

function onExportFormatChange() {
  const fmt = document.getElementById('exportFormat').value;
  const wrap = document.getElementById('exportQualityWrap');
  wrap.style.display = (fmt === 'jpeg' || fmt === 'webp') ? 'flex' : 'none';
}

// ==================== UNDO / REDO ====================
const MAX_UNDO = 40;
let undoStack = [];
let redoStack = [];

function snapshotState() {
  const bgSnap = bgImage ? { src: bgImage.src, w: canvas.width, h: canvas.height } : null;
  const stickersSnap = stickers.map(s => ({
    id: s.id, type: s.type, x: s.x, y: s.y,
    width: s.width, height: s.height, rotation: s.rotation, opacity: s.opacity,
    flipH: !!s.flipH, flipV: !!s.flipV,
    imageSrc: s.image.src,
    originalImageSrc: s.originalImage.src,
    adjustedImageSrc: s.adjustedImage ? s.adjustedImage.src : null,
    shadowEnabled: !!s.shadowEnabled,
    shadowCanvasUrl: s.shadowCanvas ? s.shadowCanvas.toDataURL() : null,
    shadowOffsetX: s.shadowOffsetX || 0,
    shadowOffsetY: s.shadowOffsetY || 0,
    shadowOpacity: s.shadowOpacity || 0.3,
    adjustments: s.adjustments ? JSON.parse(JSON.stringify(s.adjustments)) : null,
  }));
  return { bgSnap, stickersSnap, selectedId, stickerIdCounter };
}

function saveUndo() {
  redoStack = [];
  undoStack.push(snapshotState());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoButtons();
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(snapshotState());
  restoreSnapshot(undoStack.pop());
  updateUndoButtons();
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(snapshotState());
  restoreSnapshot(redoStack.pop());
  updateUndoButtons();
}

function restoreSnapshot(state) {
  // Restore background
  if (state.bgSnap) {
    const img = new Image();
    img.onload = () => {
      bgImage = img;
      initCanvas(state.bgSnap.w, state.bgSnap.h);
      ctx.drawImage(img, 0, 0, state.bgSnap.w, state.bgSnap.h);
      bgImageData = ctx.getImageData(0, 0, state.bgSnap.w, state.bgSnap.h);
      hideDropZone();
      document.getElementById('btnBlend').disabled = !selectedId;
      restoreStickersAndFinish(state);
    };
    img.src = state.bgSnap.src;
  } else {
    bgImage = null; bgImageData = null;
    initCanvas();
    document.getElementById('dropZone').style.display = '';
    document.getElementById('btnBlend').disabled = true;
    restoreStickersAndFinish(state);
  }
}

function restoreStickersAndFinish(state) {
  stickers = state.stickersSnap.map(snap => {
    const img = new Image(); img.src = snap.imageSrc;
    const origImg = new Image(); origImg.src = snap.originalImageSrc;
    const s = {
      id: snap.id, type: snap.type, image: img, originalImage: origImg,
      x: snap.x, y: snap.y, width: snap.width, height: snap.height,
      rotation: snap.rotation, opacity: snap.opacity,
      flipH: snap.flipH, flipV: snap.flipV,
      shadowEnabled: snap.shadowEnabled,
      shadowCanvas: null,
      shadowOffsetX: snap.shadowOffsetX,
      shadowOffsetY: snap.shadowOffsetY,
      shadowOpacity: snap.shadowOpacity,
      adjustedImage: null,
      adjustments: snap.adjustments,
    };
    if (snap.adjustedImageSrc) {
      const adj = new Image(); adj.src = snap.adjustedImageSrc;
      s.adjustedImage = adj;
    }
    if (snap.shadowCanvasUrl) {
      const shImg = new Image();
      shImg.onload = () => {
        const sc = document.createElement('canvas');
        sc.width = shImg.naturalWidth; sc.height = shImg.naturalHeight;
        sc.getContext('2d').drawImage(shImg, 0, 0);
        s.shadowCanvas = sc;
        if (s.id === selectedId) render();
      };
      shImg.src = snap.shadowCanvasUrl;
    }
    return s;
  });

  selectedId = state.selectedId;
  stickerIdCounter = state.stickerIdCounter;

  // Update UI
  if (selectedId) {
    const st = stickers.find(s => s.id === selectedId);
    document.getElementById('noSelectionHint').style.display = 'none';
    document.getElementById('stickerProps').style.display = '';
    document.getElementById('btnBlend').disabled = !bgImage;
    if (st) {
      const origW = st.originalImage.naturalWidth || 1;
      document.getElementById('propScale').value = Math.round(st.width / origW * 100);
      document.getElementById('propScaleVal').textContent = Math.round(st.width / origW * 100) + '%';
      document.getElementById('propRotate').value = Math.round(st.rotation);
      document.getElementById('propRotateVal').textContent = Math.round(st.rotation) + '°';
      document.getElementById('propOpacity').value = Math.round(st.opacity * 100);
      document.getElementById('propOpacityVal').textContent = Math.round(st.opacity * 100) + '%';
      updateFlipButtons(st);
    }
  } else {
    document.getElementById('noSelectionHint').style.display = '';
    document.getElementById('stickerProps').style.display = 'none';
  }
  render();
}

function updateUndoButtons() {
  const bu = document.getElementById('btnUndo');
  const br = document.getElementById('btnRedo');
  if (bu) bu.disabled = undoStack.length === 0;
  if (br) br.disabled = redoStack.length === 0;
}

// ==================== KEYBOARD SHORTCUTS ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (!cutState.active && selectedId && document.activeElement === document.body) {
      deleteSelectedSticker();
    }
  }
  if (e.key === 'Escape') {
    if (cutState.active) cancelCutMode();
    else deselectAll();
  }
  if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    undo();
  }
  if ((e.ctrlKey && e.key === 'Z' && e.shiftKey) || (e.ctrlKey && e.key === 'y')) {
    e.preventDefault();
    redo();
  }
});

}

// ==================== MOBILE SLIDER FIX (custom slider) ====================
// Replace native <input type=range> with our own track + thumb so the browser
// can never jump the value on tap. Only pressing the round thumb and dragging
// changes the value; touching the track does nothing. touch-action: pan-y
// keeps vertical scrolling over the slider working. Desktop mouse unchanged.
function syncCs(wrap) {
  const input = wrap.querySelector('input');
  if (!input) return;
  const min = parseFloat(input.min), max = parseFloat(input.max);
  const range = max - min;
  const v = Math.min(max, Math.max(min, parseFloat(input.value)));
  const pct = range > 0 ? (v - min) / range : 0;
  const width = wrap.clientWidth || 100;
  const x = 6 + (width - 12) * pct;
  const thumb = wrap.querySelector('.cs-thumb');
  const fill = wrap.querySelector('.cs-fill');
  if (thumb) thumb.style.left = x + 'px';
  if (fill) fill.style.width = Math.max(0, x - 6) + 'px';
}

function buildCustomSliders() {
  if (!window.matchMedia || !window.matchMedia('(pointer: coarse)').matches) return;
  document.querySelectorAll('input[type="range"]').forEach(function(slider) {
    if (slider.dataset.csBuilt) return;
    slider.dataset.csBuilt = '1';

    const wrap = document.createElement('div');
    wrap.className = 'cs';
    // keep the input's sizing role inside its flex row
    const cs = getComputedStyle(slider);
    if (parseFloat(cs.flexGrow) > 0) wrap.style.flex = '1 1 0%';
    if (slider.style.width) wrap.style.width = slider.style.width;
    slider.parentNode.insertBefore(wrap, slider);
    wrap.appendChild(slider);

    // keep the native input purely as the value store (still read by the app)
    slider.style.opacity = '0';
    slider.style.pointerEvents = 'none';
    slider.style.width = '100%';
    slider.style.margin = '0';

    const track = document.createElement('div'); track.className = 'cs-track'; wrap.appendChild(track);
    const fill = document.createElement('div'); fill.className = 'cs-fill'; wrap.appendChild(fill);
    const thumb = document.createElement('div'); thumb.className = 'cs-thumb'; wrap.appendChild(thumb);

    syncCs(wrap);
    attachCsDrag(wrap);
  });
}

let activeCs = null; // { wrap, startX, startValue, width, range, min, max }
document.addEventListener('pointerup', function() { activeCs = null; });
document.addEventListener('pointercancel', function() { activeCs = null; });

function attachCsDrag(wrap) {
  wrap.addEventListener('pointerdown', function(e) {
    const input = wrap.querySelector('input');
    const min = parseFloat(input.min), max = parseFloat(input.max);
    const range = max - min;
    const v = parseFloat(input.value);
    const width = wrap.clientWidth || 100;
    const thumbX = 6 + (v - min) / (range || 1) * (width - 12);
    const rect = wrap.getBoundingClientRect();
    if (Math.abs(e.clientX - (rect.left + thumbX)) <= 30) {
      activeCs = { wrap: wrap, startX: e.clientX, startValue: v, width: width, range: range, min: min, max: max };
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    }
    // else: touching the track does nothing
  });

  wrap.addEventListener('pointermove', function(e) {
    if (!activeCs || activeCs.wrap !== wrap) return;
    const dx = e.clientX - activeCs.startX;
    const raw = activeCs.startValue + (dx / (activeCs.width || 100)) * activeCs.range;
    const v = Math.round(Math.min(activeCs.max, Math.max(activeCs.min, raw)));
    const input = wrap.querySelector('input');
    if (parseFloat(input.value) !== v) {
      input.value = v;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
    syncCs(wrap);
  });
}

// Keep the custom thumb/fill in sync when the app sets values programmatically
// (selecting a sticker, undo/redo, reset) or when the layout resizes.
const csValues = new Map();
function csSyncLoop() {
  document.querySelectorAll('.cs').forEach(function(wrap) {
    const input = wrap.querySelector('input');
    const v = input.value;
    const w = wrap.clientWidth;
    const prev = csValues.get(wrap);
    if (!prev || prev.v !== v || prev.w !== w) { csValues.set(wrap, { v: v, w: w }); syncCs(wrap); }
  });
  requestAnimationFrame(csSyncLoop);
}

buildCustomSliders();
csSyncLoop();
</script>
</body>
</html>
