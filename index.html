<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片合成器 - Image Blender</title>
<style>
/* ==================== Reset & Base ==================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e; color: #e0e0e0;
  display: flex; flex-direction: column;
  user-select: none; -webkit-user-select: none;
}

/* ==================== Header ==================== */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; background: #16162b;
  border-bottom: 1px solid #2a2a4a; flex-shrink: 0;
  min-height: 48px;
}
.header .logo { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.header .logo span { color: #7c8cf8; }
.header .actions { display: flex; gap: 8px; }
.header button {
  padding: 7px 16px; border: none; border-radius: 6px;
  font-size: 13px; cursor: pointer; font-weight: 600;
  transition: all 0.15s;
}
.btn-primary { background: #7c8cf8; color: #fff; }
.btn-primary:hover { background: #6b7de8; }
.btn-outline { background: transparent; color: #ccc; border: 1px solid #444 !important; }
.btn-outline:hover { background: #2a2a4a; }
.btn-danger { background: #e0556a; color: #fff; }
.btn-danger:hover { background: #c94a5e; }

/* ==================== Main Layout ==================== */
.main {
  display: flex; flex: 1; overflow: hidden;
}

/* ==================== Left Panel - Sticker Library ==================== */
.sidebar {
  width: 240px; min-width: 240px; background: #1e1e36;
  border-right: 1px solid #2a2a4a;
  display: flex; flex-direction: column;
  overflow-y: auto; flex-shrink: 0;
}
.sidebar-section { padding: 12px; }
.sidebar-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: #888; margin-bottom: 8px;
}
.emoji-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
}
.emoji-btn {
  aspect-ratio: 1; font-size: 24px; cursor: pointer;
  background: #252540; border: 1px solid transparent;
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; transition: all 0.15s;
}
.emoji-btn:hover { background: #303058; border-color: #7c8cf8; transform: scale(1.08); }
.emoji-btn:active { transform: scale(0.95); }

.upload-sticker-btn {
  width: 100%; padding: 10px; background: #252540;
  border: 1px dashed #444; border-radius: 8px;
  color: #aaa; cursor: pointer; font-size: 12px;
  text-align: center; transition: all 0.15s;
  margin-top: 8px;
}
.upload-sticker-btn:hover { border-color: #7c8cf8; color: #ccc; }

/* ==================== Center - Canvas ==================== */
.canvas-container {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #12121f;
  background-image:
    linear-gradient(45deg, #1a1a30 25%, transparent 25%),
    linear-gradient(-45deg, #1a1a30 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #1a1a30 75%),
    linear-gradient(-45deg, transparent 75%, #1a1a30 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
  position: relative; overflow: hidden;
}
.canvas-wrapper {
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}
canvas {
  display: block;
  cursor: crosshair;
  max-width: calc(100vw - 500px);
  max-height: calc(100vh - 100px);
}
.drop-zone-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.drop-zone-text {
  font-size: 16px; color: #666; text-align: center; line-height: 1.8;
}
.drop-zone-text .icon { font-size: 48px; display: block; margin-bottom: 8px; }

/* ==================== Right Panel - Properties ==================== */
.properties {
  width: 260px; min-width: 260px; background: #1e1e36;
  border-left: 1px solid #2a2a4a;
  display: flex; flex-direction: column;
  overflow-y: auto; flex-shrink: 0; padding: 12px;
}
.prop-group {
  background: #252540; border-radius: 8px; padding: 12px;
  margin-bottom: 10px;
}
.prop-group-title {
  font-size: 11px; text-transform: uppercase;
  letter-spacing: 1px; color: #888; margin-bottom: 10px;
}
.prop-row { display: flex; align-items: center; margin-bottom: 8px; }
.prop-row:last-child { margin-bottom: 0; }
.prop-label { font-size: 12px; width: 60px; flex-shrink: 0; color: #aaa; }
.prop-row input[type="range"] { flex: 1; accent-color: #7c8cf8; height: 4px; }
.prop-value { font-size: 11px; width: 36px; text-align: right; color: #888; flex-shrink: 0; }
.prop-row input[type="checkbox"] { accent-color: #7c8cf8; }

/* Layer panel */
.layer-item {
  display:flex; align-items:center; gap:8px; padding:5px 8px;
  background:#1e1e36; border:1px solid transparent; border-radius:6px;
  cursor:pointer; transition:all 0.12s; font-size:11px;
}
.layer-item:hover { background:#2a2a4a; }
.layer-item.selected { border-color:#7c8cf8; background:#252550; }
.layer-item.drag-over { border-color:#a78bfa; border-style:dashed; }
.layer-thumb {
  width:36px; height:36px; border-radius:4px; object-fit:contain;
  background:#12121f; flex-shrink:0;
}
.layer-info { flex:1; min-width:0; overflow:hidden; }
.layer-name { color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.layer-detail { color:#777; font-size:10px; }
.layer-actions { display:flex; gap:2px; flex-shrink:0; }
.layer-btn {
  background:none; border:none; color:#888; cursor:pointer; font-size:10px;
  padding:2px 4px; border-radius:3px;
}
.layer-btn:hover { background:#3a3a5a; color:#ccc; }

.btn-blend {
  width: 100%; padding: 10px; background: linear-gradient(135deg, #7c8cf8, #a78bfa);
  border: none; border-radius: 8px; color: #fff; font-size: 14px;
  font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.btn-blend:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,140,248,0.3); }
.btn-blend:active { transform: translateY(0); }
.btn-blend:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.placeholder-text {
  color: #555; font-size: 13px; text-align: center; padding: 40px 0;
}

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: 13px; z-index: 999; pointer-events: none;
  opacity: 0; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }

/* Responsive - tablet & phone */
@media (max-width: 900px) {
  .header { flex-wrap: wrap; row-gap: 4px; padding: 6px 10px; }
  .header .logo { font-size: 15px; }
  .header .actions { flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .header button, .header select { padding: 6px 10px; font-size: 12px; }

  .main { flex-direction: column; }

  /* Canvas first on mobile */
  .canvas-container { order: 1; flex: 1 1 0; min-height: 260px; }
  .sidebar { order: 2; width: 100%; min-width: 0; max-height: 96px; overflow-y: auto; }
  .properties { order: 3; width: 100%; min-width: 0; max-height: 175px; padding: 8px; }

  .sidebar-section { padding: 6px 10px; }
  .sidebar-title { margin-bottom: 4px; }
  .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  .emoji-btn { font-size: 20px; }
  .upload-sticker-btn { padding: 8px; font-size: 11px; }

  canvas { max-width: 96vw; max-height: 42vh; }
  .prop-group { padding: 8px; margin-bottom: 6px; }
  .prop-row input[type="range"] { min-height: 28px; }
  .layer-thumb { width: 28px; height: 28px; }
  .placeholder-text { padding: 20px 0; }
}

/* Very small screens (phones) */
@media (max-width: 480px) {
  #exportQualityWrap { display: none !important; }
  .header button, .header select { padding: 5px 8px; font-size: 11px; }
  .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 3px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">🎨 <span>图片合成器</span></div>
  <div class="actions">
    <button class="btn-outline" id="btnUndo" onclick="undo()" title="撤销 (Ctrl+Z)" disabled>↩</button>
    <button class="btn-outline" id="btnRedo" onclick="redo()" title="重做 (Ctrl+Shift+Z)" disabled>↪</button>
    <button class="btn-outline" onclick="resetAll()" title="清除所有">🔄 重置</button>
    <select id="exportFormat" onchange="onExportFormatChange()" style="background:#252540;color:#ccc;border:1px solid #444;border-radius:6px;padding:6px 8px;font-size:12px;cursor:pointer;outline:none;">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
      <option value="webp">WebP</option>
    </select>
    <span id="exportQualityWrap" style="display:none;display:flex;align-items:center;gap:4px;">
      <input type="range" id="exportQuality" min="10" max="100" value="90" style="width:60px;accent-color:#7c8cf8;" oninput="document.getElementById('exportQualityVal').textContent=this.value+'%'">
      <span id="exportQualityVal" style="font-size:11px;color:#aaa;min-width:32px;">90%</span>
    </span>
    <button class="btn-primary" onclick="downloadResult()" title="下载合成图片">⬇ 下载</button>
  </div>
</div>

<!-- Main Content -->
<div class="main">

  <!-- Left: Sticker Library -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">📦 我的贴图</div>
      <div class="emoji-grid" id="custom-stickers-grid"></div>
      <div class="upload-sticker-btn" onclick="document.getElementById('stickerUpload').click()">
        ➕ 上传贴图
      </div>
      <input type="file" id="stickerUpload" accept="image/png,image/webp,image/jpeg" hidden onchange="handleStickerUpload(event)">
    </div>
  </div>

  <!-- Center: Canvas -->
  <div class="canvas-container" id="canvasContainer"
       ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="mainCanvas"></canvas>
      <div class="drop-zone-overlay" id="dropZone">
        <div class="drop-zone-text">
          <span class="icon">📁</span>
          拖拽图片到此处<br>或点击下方按钮
        </div>
      </div>
    </div>
  </div>

  <!-- Right: Properties -->
  <div class="properties" id="propertiesPanel">
    <!-- Layer panel -->
    <div id="layerPanel" style="display:none;">
      <div class="prop-group-title" style="padding:8px 4px 4px;">📑 图层</div>
      <div id="layerList" style="display:flex;flex-direction:column;gap:3px;max-height:200px;overflow-y:auto;"></div>
    </div>

    <div class="placeholder-text" id="noSelectionHint">
      👆 选择左侧贴图添加到画布<br><br>
      或上传一张底图开始
    </div>

    <div id="stickerProps" style="display:none;">
      <div class="prop-group">
        <div class="prop-group-title">📐 变换</div>
        <div class="prop-row">
          <span class="prop-label">缩放</span>
          <input type="range" id="propScale" min="10" max="300" value="100" oninput="onPropChange()">
          <span class="prop-value" id="propScaleVal">100%</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">旋转</span>
          <input type="range" id="propRotate" min="-180" max="180" value="0" oninput="onPropChange()">
          <span class="prop-value" id="propRotateVal">0°</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">透明度</span>
          <input type="range" id="propOpacity" min="10" max="100" value="100" oninput="onPropChange()">
          <span class="prop-value" id="propOpacityVal">100%</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">镜像</span>
          <button class="btn-outline" id="btnFlipH" style="flex:1;font-size:11px;padding:4px 8px;" onclick="flipStickerH()">↔ 水平</button>
          <button class="btn-outline" id="btnFlipV" style="flex:1;font-size:11px;padding:4px 8px;" onclick="flipStickerV()">↕ 垂直</button>
        </div>
        <div class="prop-row">
          <span class="prop-label">图层</span>
          <button class="btn-outline" style="flex:1;font-size:11px;padding:4px 8px;" onclick="moveStickerUp()">⬆ 上移</button>
          <button class="btn-outline" style="flex:1;font-size:11px;padding:4px 8px;" onclick="moveStickerDown()">⬇ 下移</button>
        </div>
        <button class="btn-danger" style="width:100%;margin-top:4px;padding:6px;font-size:12px;" onclick="deleteSelectedSticker()">🗑 删除贴图</button>
      </div>

      <div class="prop-group">
        <div class="prop-group-title">🔮 贴图融合</div>
        <div class="prop-row">
          <span class="prop-label">光源角度</span>
          <input type="range" id="propLightAngle" min="0" max="360" value="135" oninput="onLightAngleChange()">
          <span class="prop-value" id="propLightAngleVal">135°</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">曝光匹配</span>
          <input type="range" id="propBlendStrength" min="5" max="100" value="25">
        </div>
        <div class="prop-row">
          <span class="prop-label">边缘柔化</span>
          <input type="range" id="propFeather" min="0" max="30" value="10">
          <span class="prop-value" id="propFeatherVal">10</span>
        </div>
        <div class="prop-row" style="margin-top:4px;">
          <span class="prop-label">风格</span>
          <select id="propStyle" onchange="onStyleChange()" style="flex:1;background:#1e1e36;color:#ccc;border:1px solid #3a3a5a;border-radius:5px;padding:5px 8px;font-size:11px;cursor:pointer;outline:none;">
            <option value="auto">自动检测</option>
            <option value="photo">写实照片</option>
            <option value="anime">二次元/动漫</option>
            <option value="sketch">黑白线稿/素描</option>
            <option value="3d">3D渲染</option>
          </select>
        </div>
        <div class="style-indicator" id="styleIndicator" style="display:none;font-size:11px;color:#7c8cf8;text-align:center;padding:3px 0;"></div>
        <button class="btn-blend" id="btnBlend" onclick="autoBlend()" disabled>
          ✨ 贴图融合
        </button>
        <button class="btn-outline" style="width:100%;margin-top:6px;padding:6px;font-size:12px;" onclick="resetStickerAdjustments()">
          ↩ 撤销融合
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden file input for background -->
<input type="file" id="bgUpload" accept="image/*" hidden onchange="handleBgUpload(event)">

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Bottom bar with quick actions (shown when no bg) -->
<div id="bottomBar" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;">
  <button class="btn-primary" style="padding:12px 28px;font-size:15px;border-radius:10px;box-shadow:0 4px 20px rgba(124,140,248,0.4);"
          onclick="document.getElementById('bgUpload').click()">
    📁 上传底图
  </button>
</div>

<script>
// ==================== DATA ====================
let customStickers = [];  // { id, name, dataUrl, thumb } — persisted in IndexedDB

// ==================== STATE ====================
let bgImage = null;              // HTMLImageElement of background
let bgImageData = null;          // ImageData of background (for pixel sampling)
let stickers = [];               // Array of sticker objects
let selectedId = null;           // Currently selected sticker ID
let stickerIdCounter = 0;
let canvasScale = 1;             // Scale factor (bg original → canvas display)
let bgOffsetX = 0, bgOffsetY = 0; // Background offset within canvas

// Interaction state
let interactionMode = null;      // 'move' | 'scale' | 'rotate' | null
let dragStartMouse = null;       // {x, y} at mousedown
let dragStartSticker = null;     // Snapshot of sticker at mousedown
let dragCornerIndex = -1;        // Which corner (0=TL, 1=TR, 2=BR, 3=BL)

const HANDLE_RADIUS = 8;
const HANDLE_HIT_RADIUS = 12;

// ==================== INIT ====================
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const canvasWrapper = document.getElementById('canvasWrapper');

// ==================== CUSTOM STICKER PERSISTENCE (IndexedDB) ====================
const DB_NAME = 'image_blender_db';
const DB_VERSION = 1;
const STORE_NAME = 'stickers';

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    request.onsuccess = (e) => resolve(e.target.result);
    request.onerror = (e) => reject(e.target.error);
  });
}

async function loadCustomStickers() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const all = await new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    customStickers = all || [];
    console.log('📦 IndexedDB 加载了 ' + customStickers.length + ' 个贴图');
  } catch (e) {
    console.error('❌ 加载贴图失败:', e);
    customStickers = [];
  }
}

async function saveCustomStickers() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.clear();
    for (const s of customStickers) {
      store.put(s);
    }
    await new Promise((resolve, reject) => {
      tx.oncomplete = () => {
        console.log('💾 IndexedDB 保存了 ' + customStickers.length + ' 个贴图');
        resolve();
      };
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    console.error('❌ 保存贴图失败:', e);
    showToast('❌ 保存失败，请重试');
  }
}

// Resize an image from a data URL and return a new data URL via callback
function resizeImageDataUrl(dataUrl, maxDim, callback) {
  const img = new Image();
  img.onload = () => {
    try {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxDim || h > maxDim) {
        const s = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * s);
        h = Math.round(h * s);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(c.toDataURL('image/png'));
    } catch (e) {
      console.error('缩略图生成失败:', e);
      callback(dataUrl); // fallback to original
    }
  };
  img.onerror = () => {
    console.error('图片加载失败，使用原始 data URL');
    callback(dataUrl);
  };
  img.src = dataUrl;
}

function renderCustomStickerGrid() {
  const grid = document.getElementById('custom-stickers-grid');
  if (!grid) return;
  if (customStickers.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;color:#555;font-size:12px;text-align:center;padding:12px;">暂无贴图<br>点击下方按钮上传</div>';
    return;
  }
  grid.innerHTML = customStickers.map((s, idx) => `
    <div class="emoji-btn" style="position:relative;overflow:hidden;" title="${s.name}" onclick="addCustomStickerById('${s.id}')">
      <img src="${s.thumb || s.dataUrl}" style="width:100%;height:100%;object-fit:contain;" alt="${s.name}">
      <span style="position:absolute;top:1px;right:2px;font-size:10px;cursor:pointer;opacity:0.6;background:rgba(0,0,0,0.5);border-radius:2px;padding:0 2px;"
            onclick="event.stopPropagation();deleteCustomSticker('${s.id}')"
            title="删除贴图">✕</span>
    </div>
  `).join('');
}

function addCustomStickerById(id) {
  const sticker = customStickers.find(s => s.id === id);
  if (!sticker) return;
  const img = new Image();
  img.onload = () => addImageSticker(img);
  img.src = sticker.dataUrl; // Use full-res for canvas
}

function deleteCustomSticker(id) {
  if (!confirm('确定删除这个贴图吗？')) return;
  customStickers = customStickers.filter(s => s.id !== id);
  saveCustomStickers();
  renderCustomStickerGrid();
  showToast('🗑 贴图已删除');
}

// ==================== CANVAS SETUP ====================
function defaultCanvasSize() {
  const container = document.getElementById('canvasContainer');
  const w = container ? Math.max(160, Math.min(container.clientWidth - 12, 1200)) : 800;
  const h = container ? Math.max(160, Math.min(container.clientHeight - 12, 800)) : 600;
  return { w, h };
}

function initCanvas(w, h) {
  const s = defaultCanvasSize();
  canvas.width = w || s.w;
  canvas.height = h || s.h;
  canvas.style.width = canvas.width + 'px';
  canvas.style.height = canvas.height + 'px';
}

function fitBackgroundToCanvas(img) {
  const container = document.getElementById('canvasContainer');
  const availW = container ? Math.max(160, container.clientWidth - 16) : window.innerWidth - 24;
  const availH = container ? Math.max(160, container.clientHeight - 16) : window.innerHeight - 150;
  const maxW = Math.min(availW, 1200);
  const maxH = Math.min(availH, 800);
  let w = img.naturalWidth;
  let h = img.naturalHeight;
  if (w > maxW || h > maxH) {
    const scale = Math.min(maxW / w, maxH / h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  return { w, h };
}

// ==================== RENDER ====================
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw background
  if (bgImage) {
    ctx.drawImage(bgImage, bgOffsetX, bgOffsetY, canvas.width, canvas.height);
  } else {
    // Draw placeholder
    ctx.fillStyle = '#1a1a30';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw stickers (back to front)
  for (const sticker of stickers) {
    drawSticker(sticker);
  }

  // Draw selection handles
  if (selectedId) {
    const sticker = stickers.find(s => s.id === selectedId);
    if (sticker) drawSelectionHandles(sticker);
  }

  // Refresh layer panel (debounced via rAF to avoid thrashing during drag)
  if (!render._layerScheduled) {
    render._layerScheduled = true;
    requestAnimationFrame(() => {
      renderLayerPanel();
      render._layerScheduled = false;
    });
  }
}

function drawSticker(sticker) {
  ctx.save();
  ctx.translate(sticker.x, sticker.y);

  const img = sticker.adjustedImage || sticker.image;
  const w = sticker.width;
  const h = sticker.height;

  // Build flip scales
  const sx = sticker.flipH ? -1 : 1;
  const sy = sticker.flipV ? -1 : 1;

  // Draw shadow using screen-space offset (shadow falls AWAY from light source)
  if (sticker.shadowEnabled && sticker.shadowCanvas) {
    ctx.save();
    // Shadow opacity: use per-sticker strength if set, otherwise default
    const shadowAlpha = (sticker.shadowOpacity || 0.3) * sticker.opacity;
    ctx.globalAlpha = shadowAlpha;
    // Shadow offset is in screen space (pre-computed during blend)
    ctx.translate(sticker.shadowOffsetX || 0, sticker.shadowOffsetY || 0);
    // Shadow silhouette rotates with the sticker AND mirrors with it
    ctx.rotate(sticker.rotation * Math.PI / 180);
    ctx.scale(sx, sy);
    const sCanvas = sticker.shadowCanvas;
    const sw = sCanvas.width;
    const sh = sCanvas.height;
    ctx.drawImage(sCanvas, -sw/2, -sh/2, sw, sh);
    ctx.restore();
  }

  // Draw sticker with rotation + mirror
  ctx.rotate(sticker.rotation * Math.PI / 180);
  ctx.scale(sx, sy);
  ctx.globalAlpha = sticker.opacity;
  ctx.drawImage(img, -w/2, -h/2, w, h);

  // Selection indicator
  if (sticker.id === selectedId) {
    ctx.strokeStyle = 'rgba(124,140,248,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(-w/2 - 2, -h/2 - 2, w + 4, h + 4);
    ctx.setLineDash([]);
  }

  ctx.restore();
}

function drawSelectionHandles(sticker) {
  ctx.save();
  ctx.translate(sticker.x, sticker.y);
  ctx.rotate(sticker.rotation * Math.PI / 180);
  const w = sticker.width;
  const h = sticker.height;

  // Corner handles
  const corners = [
    [-w/2, -h/2], [w/2, -h/2], [w/2, h/2], [-w/2, h/2]
  ];

  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#7c8cf8';
  ctx.lineWidth = 2;
  for (const [cx, cy] of corners) {
    ctx.fillRect(cx - HANDLE_RADIUS/2, cy - HANDLE_RADIUS/2, HANDLE_RADIUS, HANDLE_RADIUS);
    ctx.strokeRect(cx - HANDLE_RADIUS/2, cy - HANDLE_RADIUS/2, HANDLE_RADIUS, HANDLE_RADIUS);
  }

  // Rotation handle
  const rotHandleY = -h/2 - 30;
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(0, rotHandleY);
  ctx.strokeStyle = '#7c8cf8';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Rotation circle
  ctx.beginPath();
  ctx.arc(0, rotHandleY, HANDLE_RADIUS/2 + 2, 0, Math.PI * 2);
  ctx.fillStyle = '#7c8cf8';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

// Load image from file
function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addImageSticker(img) {
  if (!bgImage && stickers.length === 0) {
    // Allow image sticker as first element if no bg
  }

  const maxDim = 200;
  let w = img.naturalWidth;
  let h = img.naturalHeight;
  if (w > maxDim || h > maxDim) {
    const s = Math.min(maxDim / w, maxDim / h);
    w = Math.round(w * s);
    h = Math.round(h * s);
  }

  const sticker = {
    id: 'sticker_' + (++stickerIdCounter),
    type: 'image',
    image: img,
    originalImage: img,
    x: canvas.width / 2,
    y: canvas.height / 2,
    width: w,
    height: h,
    rotation: 0,
    opacity: 1,
    flipH: false,
    flipV: false,
    shadowEnabled: false,
    shadowCanvas: null,
    shadowOffsetX: 0,
    shadowOffsetY: 0,
    adjustedImage: null,
    adjustments: null,
  };

  saveUndo();
  stickers.push(sticker);
  selectSticker(sticker.id);
  render();
  hideDropZone();
}

function selectSticker(id) {
  selectedId = id;
  document.getElementById('noSelectionHint').style.display = 'none';
  document.getElementById('stickerProps').style.display = '';
  document.getElementById('bottomBar').style.display = 'none';
  document.getElementById('btnBlend').disabled = !bgImage;

  const sticker = stickers.find(s => s.id === id);
  if (!sticker) return;

  // Update property sliders (suppress oninput)
  document.getElementById('propScale').value = Math.round(sticker.width / sticker.originalImage.naturalWidth * 100);
  document.getElementById('propScaleVal').textContent = Math.round(sticker.width / sticker.originalImage.naturalWidth * 100) + '%';
  document.getElementById('propRotate').value = Math.round(sticker.rotation);
  document.getElementById('propRotateVal').textContent = Math.round(sticker.rotation) + '°';
  document.getElementById('propOpacity').value = Math.round(sticker.opacity * 100);
  document.getElementById('propOpacityVal').textContent = Math.round(sticker.opacity * 100) + '%';

  updateFlipButtons(sticker);

  render();
}

function deselectAll() {
  selectedId = null;
  document.getElementById('noSelectionHint').style.display = '';
  document.getElementById('stickerProps').style.display = 'none';
  if (!bgImage) document.getElementById('bottomBar').style.display = '';
  render();
}

function deleteSelectedSticker() {
  if (!selectedId) return;
  saveUndo();
  stickers = stickers.filter(s => s.id !== selectedId);
  selectedId = null;
  if (stickers.length > 0) {
    selectSticker(stickers[stickers.length - 1].id);
  } else {
    deselectAll();
  }
  render();
}

function moveStickerUp() {
  if (!selectedId) return;
  const idx = stickers.findIndex(s => s.id === selectedId);
  if (idx < stickers.length - 1) {
    saveUndo();
    [stickers[idx], stickers[idx + 1]] = [stickers[idx + 1], stickers[idx]];
    render();
  }
}

function moveStickerDown() {
  if (!selectedId) return;
  const idx = stickers.findIndex(s => s.id === selectedId);
  if (idx > 0) {
    saveUndo();
    [stickers[idx], stickers[idx - 1]] = [stickers[idx - 1], stickers[idx]];
    render();
  }
}

function flipStickerH() {
  if (!selectedId) return;
  saveUndo();
  const sticker = stickers.find(s => s.id === selectedId);
  if (!sticker) return;
  sticker.flipH = !sticker.flipH;
  updateFlipButtons(sticker);
  render();
}

function flipStickerV() {
  if (!selectedId) return;
  saveUndo();
  const sticker = stickers.find(s => s.id === selectedId);
  if (!sticker) return;
  sticker.flipV = !sticker.flipV;
  updateFlipButtons(sticker);
  render();
}

function updateFlipButtons(sticker) {
  const btnH = document.getElementById('btnFlipH');
  const btnV = document.getElementById('btnFlipV');
  if (btnH) btnH.style.background = sticker.flipH ? '#7c8cf8' : '';
  if (btnV) btnV.style.background = sticker.flipV ? '#7c8cf8' : '';
}

// ==================== LAYER PANEL ====================
let layerDragIdx = -1;

function renderLayerPanel() {
  const panel = document.getElementById('layerPanel');
  const list = document.getElementById('layerList');
  if (!panel || !list) return;

  if (stickers.length === 0) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';

  // Render in reverse: top layer (last in array) shown first in UI
  list.innerHTML = '';
  for (let i = stickers.length - 1; i >= 0; i--) {
    const s = stickers[i];
    const isSel = s.id === selectedId;
    const imgSrc = s.image ? s.image.src : '';
    const dims = Math.round(s.width) + '×' + Math.round(s.height);
    const extra = [];
    if (s.flipH) extra.push('↔');
    if (s.flipV) extra.push('↕');
    if (s.adjustments) extra.push('✨');
    const label = extra.length ? extra.join('') + ' ' + dims : dims;

    const div = document.createElement('div');
    div.className = 'layer-item' + (isSel ? ' selected' : '');
    div.draggable = true;
    div.dataset.idx = i;
    div.title = '拖拽排序 | 点击选中';
    div.innerHTML = `
      <img class="layer-thumb" src="${imgSrc}" alt="">
      <div class="layer-info">
        <div class="layer-name">图层 ${stickers.length - i}</div>
        <div class="layer-detail">${label}</div>
      </div>
      <div class="layer-actions">
        <button class="layer-btn" title="上移一层" onclick="event.stopPropagation();moveStickerUp();">▲</button>
        <button class="layer-btn" title="下移一层" onclick="event.stopPropagation();moveStickerDown();">▼</button>
      </div>`;

    div.addEventListener('click', () => {
      if (s.id === selectedId) deselectAll();
      else selectSticker(s.id);
    });

    div.addEventListener('dragstart', (e) => {
      layerDragIdx = i;
      div.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    div.addEventListener('dragend', () => {
      div.style.opacity = '1';
      document.querySelectorAll('.layer-item').forEach(el => el.classList.remove('drag-over'));
      layerDragIdx = -1;
    });
    div.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      div.classList.add('drag-over');
    });
    div.addEventListener('dragleave', () => {
      div.classList.remove('drag-over');
    });
    div.addEventListener('drop', (e) => {
      e.preventDefault();
      div.classList.remove('drag-over');
      if (layerDragIdx < 0 || layerDragIdx === i) return;
      saveUndo();
      const moved = stickers.splice(layerDragIdx, 1)[0];
      stickers.splice(i, 0, moved);
      render();
      renderLayerPanel();
    });

    list.appendChild(div);
  }
}

// ==================== CANVAS INTERACTION ====================
canvas.addEventListener('mousedown', onMouseDown);
canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('mouseup', onMouseUp);
canvas.addEventListener('mouseleave', onMouseUp);
canvas.addEventListener('wheel', onWheel);

// Touch support
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd);

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function hitTestSticker(pos) {
  // Check in reverse order (top of z-order first)
  for (let i = stickers.length - 1; i >= 0; i--) {
    const s = stickers[i];
    if (pointInSticker(pos.x, pos.y, s)) {
      return s.id;
    }
  }
  return null;
}

function pointInSticker(px, py, sticker) {
  // Transform to local coordinates
  const dx = px - sticker.x;
  const dy = py - sticker.y;
  const rad = -sticker.rotation * Math.PI / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const lx = dx * cos - dy * sin;
  const ly = dx * sin + dy * cos;
  return Math.abs(lx) <= sticker.width / 2 && Math.abs(ly) <= sticker.height / 2;
}

function getHandleHit(pos, sticker) {
  // Transform to local coordinates
  const dx = pos.x - sticker.x;
  const dy = pos.y - sticker.y;
  const rad = -sticker.rotation * Math.PI / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const lx = dx * cos - dy * sin;
  const ly = dx * sin + dy * cos;

  const w = sticker.width, h = sticker.height;

  // Check corner handles
  const corners = [[-w/2, -h/2], [w/2, -h/2], [w/2, h/2], [-w/2, h/2]];
  for (let i = 0; i < corners.length; i++) {
    const [cx, cy] = corners[i];
    if (Math.abs(lx - cx) < HANDLE_HIT_RADIUS && Math.abs(ly - cy) < HANDLE_HIT_RADIUS) {
      return { type: 'corner', index: i };
    }
  }

  // Check rotation handle
  const rotY = -h/2 - 30;
  if (Math.abs(lx) < HANDLE_HIT_RADIUS && Math.abs(ly - rotY) < HANDLE_HIT_RADIUS) {
    return { type: 'rotation', index: -1 };
  }

  return null;
}

function onMouseDown(e) {
  if (e.button !== 0) return;
  const pos = getCanvasPos(e);

  // Check if clicking on selected sticker's handles
  if (selectedId) {
    const sticker = stickers.find(s => s.id === selectedId);
    if (sticker) {
      const hit = getHandleHit(pos, sticker);
      if (hit) {
        saveUndo();
        interactionMode = hit.type === 'corner' ? 'scale' : 'rotate';
        dragStartMouse = pos;
        dragStartSticker = { ...sticker, width: sticker.width, height: sticker.height, rotation: sticker.rotation, x: sticker.x, y: sticker.y };
        dragCornerIndex = hit.index;
        e.preventDefault();
        return;
      }
      // Check if clicking on sticker body
      if (pointInSticker(pos.x, pos.y, sticker)) {
        saveUndo();
        interactionMode = 'move';
        dragStartMouse = pos;
        dragStartSticker = { x: sticker.x, y: sticker.y };
        e.preventDefault();
        return;
      }
    }
  }

  // Check if clicking on any sticker
  const hitId = hitTestSticker(pos);
  if (hitId) {
    selectSticker(hitId);
    saveUndo();
    const sticker = stickers.find(s => s.id === hitId);
    interactionMode = 'move';
    dragStartMouse = pos;
    dragStartSticker = { x: sticker.x, y: sticker.y };
    e.preventDefault();
    return;
  }

  // Clicked empty space
  deselectAll();
  interactionMode = null;
}

function onMouseMove(e) {
  const pos = getCanvasPos(e);

  if (interactionMode === 'move') {
    const dx = pos.x - dragStartMouse.x;
    const dy = pos.y - dragStartMouse.y;
    const sticker = stickers.find(s => s.id === selectedId);
    if (sticker) {
      sticker.x = dragStartSticker.x + dx;
      sticker.y = dragStartSticker.y + dy;
      render();
    }
  } else if (interactionMode === 'scale') {
    const sticker = stickers.find(s => s.id === selectedId);
    if (sticker) {
      // Vector from sticker center to mouse
      const dx = pos.x - sticker.x;
      const dy = pos.y - sticker.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Original distance from center to that corner
      const origW = dragStartSticker.width;
      const origH = dragStartSticker.height;
      const origCornerDist = Math.sqrt((origW/2)**2 + (origH/2)**2);

      const scale = Math.max(0.1, Math.min(5, dist / origCornerDist));
      const newW = Math.round(origW * scale);
      const newH = Math.round(origH * scale);
      sticker.width = newW;
      sticker.height = newH;

      // Update slider
      const origImgW = sticker.originalImage.naturalWidth;
      document.getElementById('propScale').value = Math.round(newW / origImgW * 100);
      document.getElementById('propScaleVal').textContent = Math.round(newW / origImgW * 100) + '%';

      render();
    }
  } else if (interactionMode === 'rotate') {
    const sticker = stickers.find(s => s.id === selectedId);
    if (sticker) {
      const dx = pos.x - sticker.x;
      const dy = pos.y - sticker.y;
      const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      sticker.rotation = angle;

      document.getElementById('propRotate').value = Math.round(angle);
      document.getElementById('propRotateVal').textContent = Math.round(angle) + '°';

      render();
    }
  } else {
    // Update cursor
    if (selectedId) {
      const sticker = stickers.find(s => s.id === selectedId);
      if (sticker) {
        const hit = getHandleHit(pos, sticker);
        if (hit) {
          canvas.style.cursor = hit.type === 'corner' ? 'nwse-resize' : 'grab';
        } else if (pointInSticker(pos.x, pos.y, sticker)) {
          canvas.style.cursor = 'move';
        } else {
          canvas.style.cursor = 'crosshair';
        }
      }
    } else {
      const hitId = hitTestSticker(pos);
      canvas.style.cursor = hitId ? 'pointer' : 'crosshair';
    }
  }
}

function onMouseUp(e) {
  if (interactionMode) {
    // Invalidate cached adjustments if sticker was moved/resized/rotated
    if (selectedId && (interactionMode === 'move' || interactionMode === 'scale' || interactionMode === 'rotate')) {
      const sticker = stickers.find(s => s.id === selectedId);
      if (sticker && sticker.adjustments) {
        // Don't invalidate, user can still use the adjusted image
      }
    }
  }
  interactionMode = null;
  dragStartMouse = null;
  dragStartSticker = null;
  dragCornerIndex = -1;
  canvas.style.cursor = 'crosshair';
}

function onWheel(e) {
  if (selectedId) {
    const sticker = stickers.find(s => s.id === selectedId);
    if (sticker && pointInSticker(e.offsetX, e.offsetY, sticker)) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.95 : 1.05;
      sticker.width = Math.max(10, Math.round(sticker.width * delta));
      sticker.height = Math.max(10, Math.round(sticker.height * delta));

      const origW = sticker.originalImage.naturalWidth;
      document.getElementById('propScale').value = Math.round(sticker.width / origW * 100);
      document.getElementById('propScaleVal').textContent = Math.round(sticker.width / origW * 100) + '%';
      render();
    }
  }
}

// Touch handlers
function onTouchStart(e) {
  if (e.touches.length === 1) {
    // Single touch - synthesize mouse event
    const touch = e.touches[0];
    const mouseEvent = { button: 0, clientX: touch.clientX, clientY: touch.clientY, preventDefault: () => {} };
    onMouseDown(mouseEvent);
    e.preventDefault();
  } else if (e.touches.length === 2 && selectedId) {
    // Pinch to scale
    interactionMode = 'pinch';
    const t1 = e.touches[0], t2 = e.touches[1];
    dragStartSticker = {
      dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY),
      width: stickers.find(s => s.id === selectedId).width,
    };
    e.preventDefault();
  }
}

function onTouchMove(e) {
  if (interactionMode === 'pinch' && e.touches.length === 2 && selectedId) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const scale = dist / dragStartSticker.dist;
    const sticker = stickers.find(s => s.id === selectedId);
    sticker.width = Math.max(10, Math.round(dragStartSticker.width * scale));
    sticker.height = Math.max(10, Math.round(dragStartSticker.width * scale * (sticker.height / sticker.width || 1)));
    render();
    e.preventDefault();
  } else if (interactionMode && e.touches.length === 1) {
    const touch = e.touches[0];
    onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
    e.preventDefault();
  }
}

function onTouchEnd(e) {
  onMouseUp({});
}

async function handleBgUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const img = await fileToImage(file);
    bgImage = img;
    const dims = fitBackgroundToCanvas(img);
    initCanvas(dims.w, dims.h);

    // Extract background pixel data for analysis
    ctx.drawImage(img, 0, 0, dims.w, dims.h);
    bgImageData = ctx.getImageData(0, 0, dims.w, dims.h);

    hideDropZone();
    document.getElementById('bottomBar').style.display = 'none';
    document.getElementById('btnBlend').disabled = !selectedId;
    render();

    // Auto-detect background style
    setTimeout(() => {
      try {
        detectedStyle = detectImageStyle(bgImage);
        updateStyleIndicator();
      } catch (e) { console.warn('风格检测失败:', e); }
    }, 50);

    showToast('✅ 底图已加载，点击左侧贴图开始编辑');
  } catch (err) {
    showToast('❌ 图片加载失败，请重试');
    console.error(err);
  }
  event.target.value = '';
}

async function handleStickerUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const img = await fileToImage(file);
    const originalDataUrl = img.src;
    const name = file.name.replace(/\.[^.]+$/, '');
    const id = 'custom_' + Date.now();

    // Step 1: Resize to 400px for canvas use (keeps quality, small file size ~50-100KB)
    resizeImageDataUrl(originalDataUrl, 400, (dataUrl400) => {
      // Step 2: Create 128px thumbnail for grid display (~10-20KB)
      resizeImageDataUrl(dataUrl400, 128, (thumb128) => {
        const stickerEntry = { id, name, dataUrl: dataUrl400, thumb: thumb128 };
        customStickers.push(stickerEntry);
        saveCustomStickers();
        renderCustomStickerGrid();
        console.log('💾 贴图已保存:', name, '400px=' + (dataUrl400.length/1024).toFixed(0) + 'KB', '128px=' + (thumb128.length/1024).toFixed(0) + 'KB');
        showToast('✅ 贴图已添加并保存');
      });
    });

    // Also add to canvas right now (uses the already-loaded original image)
    await addImageSticker(img);
  } catch (err) {
    showToast('❌ 贴图加载失败');
    console.error(err);
  }
  event.target.value = '';
}

async function handleDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file || !file.type.startsWith('image/')) {
    showToast('⚠️ 请拖入图片文件');

  try {

    // If no background yet, use as background
    if (!bgImage) {
      bgImage = img;
      const dims = fitBackgroundToCanvas(img);
      initCanvas(dims.w, dims.h);
      ctx.drawImage(img, 0, 0, dims.w, dims.h);
      bgImageData = ctx.getImageData(0, 0, dims.w, dims.h);
      hideDropZone();
      document.getElementById('bottomBar').style.display = 'none';
      render();

      // Auto-detect background style
      setTimeout(() => {
        try {
          detectedStyle = detectImageStyle(bgImage);
          updateStyleIndicator();

      }, 50);

      showToast('✅ 底图已加载，点击左侧贴图开始编辑');
    } else {
      // Use as sticker - also save to library
      const originalDataUrl = img.src;
      const name = file.name.replace(/\.[^.]+$/, '');
      const id = 'custom_' + Date.now();
      const exists = customStickers.some(s => s.name === name);
      if (!exists) {
        resizeImageDataUrl(originalDataUrl, 400, (dataUrl400) => {
          resizeImageDataUrl(dataUrl400, 128, (thumb128) => {
            customStickers.push({ id, name, dataUrl: dataUrl400, thumb: thumb128 });

            renderCustomStickerGrid();
          });

      }
      await addImageSticker(img);

  }
