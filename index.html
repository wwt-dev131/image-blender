// ==================== AUTO BLEND ====================
function autoBlend() {
  if (!selectedId || !bgImage) return;
  saveUndo();
  const sticker = stickers.find(s => s.id === selectedId);
  if (!sticker) return;

  // Determine effective style
  const styleKey = userStyleOverride || (detectedStyle ? detectedStyle.style : 'photo');
  const stylePreset = getStylePreset(styleKey);

  const blendStrength = parseInt(document.getElementById('propBlendStrength').value) / 100;
  const featherAmount = parseInt(document.getElementById('propFeather').value);
  const manualLightAngle = parseInt(document.getElementById('propLightAngle').value);

  // Quick analysis of background and sticker (lightweight)
  const bg = analyzeBackgroundRegion(sticker);
  const st = analyzeStickerImage(sticker);

  if (bg.count < 10 || st.count < 10) {
    showToast('⚠️ 采样点不足，请确保贴纸在底图范围内');
    return;
  }

  // Apply style-aware blend
  applyAutoBlend(sticker, bg, st, {
    blendStrength,
    featherAmount,
    lightAngle: manualLightAngle,
    stylePreset,
  });

  sticker.adjustments = {
    blendStrength,
    featherAmount,
    lightAngle: manualLightAngle,
    style: styleKey,
    bgLuminance: bg.meanL,
    stickerLuminance: st.meanL,
    autoLightAngle: bg.lightAngle,
  };

  // Update light angle slider to show auto-detected value
  document.getElementById('propLightAngle').value = Math.round(bg.lightAngle);
  document.getElementById('propLightAngleVal').textContent = Math.round(bg.lightAngle) + '°';

  document.getElementById('btnBlend').textContent = '✅ 融合完成';
  setTimeout(() => { document.getElementById('btnBlend').textContent = '✨ 贴图融合'; }, 1500);

  render();
  const presetLabel = stylePreset.label;
  showToast('✅ ' + presetLabel + '风格融合完成');
}

function analyzeBackgroundRegion(sticker) {
  // Re-extract background pixel data
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  const bgData = tempCtx.getImageData(0, 0, canvas.width, canvas.height);
  const data = bgData.data;
  const imgW = bgData.width;
  const imgH = bgData.height;

  const cx = sticker.x, cy = sticker.y;
  // Sample a LARGER area (1.4x) to capture surrounding context, not just what's under the sticker
  const sampleRadius = Math.max(sticker.width, sticker.height) * 0.7;
  const step = 4;

  let totalL = 0, totalR = 0, totalG = 0, totalB = 0, count = 0;
  let totalSat = 0;
  const samples = [];

  // Also track per-quadrant brightness for gradient detection
  let quadTL = 0, quadTR = 0, quadBL = 0, quadBR = 0;
  let qcTL = 0, qcTR = 0, qcBL = 0, qcBR = 0;

  for (let dy = -sampleRadius; dy <= sampleRadius; dy += step) {
    for (let dx = -sampleRadius; dx <= sampleRadius; dx += step) {
      if (dx*dx + dy*dy > sampleRadius*sampleRadius) continue;
      const sx = Math.round(cx + dx);
      const sy = Math.round(cy + dy);
      if (sx < 0 || sy < 0 || sx >= imgW || sy >= imgH) continue;
      const i = (sy * imgW + sx) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      const l = 0.299 * r + 0.587 * g + 0.114 * b;
      const sat = Math.max(r,g,b) - Math.min(r,g,b);
      totalL += l; totalR += r; totalG += g; totalB += b;
      totalSat += sat;
      samples.push({ l, r, g, b, sat, sx, sy });

      // Quadrant tracking (relative to sticker center)
      if (dx <= 0 && dy <= 0) { quadTL += l; qcTL++; }
      else if (dx > 0 && dy <= 0) { quadTR += l; qcTR++; }
      else if (dx <= 0 && dy > 0) { quadBL += l; qcBL++; }
      else { quadBR += l; qcBR++; }
      count++;
    }
  }

  if (count < 10) {
    return { meanL: 128, stdL: 40, meanR: 128, meanG: 128, meanB: 128, meanSat: 30,
             stdSat: 20, lightAngle: 135, colorTemp: 0, count: 0, gradH: 0, gradV: 0 };
  }

  const meanL = totalL / count;
  const meanR = totalR / count;
  const meanG = totalG / count;
  const meanB = totalB / count;
  const meanSat = totalSat / count;

  let varL = 0, varSat = 0;
  for (const s of samples) {
    varL += (s.l - meanL) ** 2;
    varSat += (s.sat - meanSat) ** 2;
  }
  const stdL = Math.sqrt(varL / count);
  const stdSat = Math.sqrt(varSat / count);

  const colorTemp = (meanR - meanB) / Math.max(meanR + meanB, 1) * 100;

  // === Horizontal & vertical brightness gradient across the sticker ===
  const qTL = qcTL > 0 ? quadTL/qcTL : meanL;
  const qTR = qcTR > 0 ? quadTR/qcTR : meanL;
  const qBL = qcBL > 0 ? quadBL/qcBL : meanL;
  const qBR = qcBR > 0 ? quadBR/qcBR : meanL;

  // Horizontal gradient: right half - left half (positive = brighter on right)
  const gradH = ((qTR + qBR) - (qTL + qBL)) / Math.max(2, sampleRadius * 2);
  // Vertical gradient: bottom half - top half (positive = brighter at bottom)
  const gradV = ((qBL + qBR) - (qTL + qTR)) / Math.max(2, sampleRadius * 2);

  // === Full-image light direction analysis ===
  const sparseStep = 20;
  let gradFullX = 0, gradFullY = 0, gradCount = 0;
  for (let y = sparseStep; y < imgH - sparseStep; y += sparseStep) {
    for (let x = sparseStep; x < imgW - sparseStep; x += sparseStep) {
      const i = (y * imgW + x) * 4;
      const lHere = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      const lRight = 0.299 * data[(y * imgW + (x + sparseStep)) * 4 + 0]
                   + 0.587 * data[(y * imgW + (x + sparseStep)) * 4 + 1]
                   + 0.114 * data[(y * imgW + (x + sparseStep)) * 4 + 2];
      const lDown = 0.299 * data[((y + sparseStep) * imgW + x) * 4 + 0]
                  + 0.587 * data[((y + sparseStep) * imgW + x) * 4 + 1]
                  + 0.114 * data[((y + sparseStep) * imgW + x) * 4 + 2];
      gradFullX += lRight - lHere;
      gradFullY += lDown - lHere;
      gradCount++;
    }
  }
  const lightAngle = Math.atan2(-gradFullY, -gradFullX) * 180 / Math.PI;
  const normalizedAngle = ((lightAngle % 360) + 360) % 360;

  console.log('🔍 底图分析:', {
    采样范围: `${Math.round(sampleRadius)}px`,
    采样点数: count,
    平均亮度: meanL.toFixed(1),
    亮度范围: `±${stdL.toFixed(1)}`,
    颜色: `R${meanR.toFixed(0)} G${meanG.toFixed(0)} B${meanB.toFixed(0)}`,
    水平渐变: gradH > 0.5 ? '→右侧更亮' : gradH < -0.5 ? '→左侧更亮' : '均匀',
    垂直渐变: gradV > 0.5 ? '→下方更亮' : gradV < -0.5 ? '→上方更亮' : '均匀',
    光源: normalizedAngle.toFixed(0) + '°',
  });

  return { meanL, stdL, meanR, meanG, meanB, meanSat, stdSat,
           lightAngle: normalizedAngle, colorTemp, count, gradH, gradV,
           sampleRadius };
}

function analyzeStickerImage(sticker) {
  const img = sticker.originalImage;
  const imgW = img.naturalWidth;
  const imgH = img.naturalHeight;
  const offCanvas = document.createElement('canvas');
  offCanvas.width = imgW;
  offCanvas.height = imgH;
  const offCtx = offCanvas.getContext('2d');
  offCtx.drawImage(img, 0, 0);
  const imageData = offCtx.getImageData(0, 0, imgW, imgH);
  const data = imageData.data;

  let totalL = 0, totalR = 0, totalG = 0, totalB = 0, opaqueCount = 0;
  let totalSat = 0;
  const samples = [];

  const step = 2;
  for (let i = 0; i < data.length; i += 4 * step) {
    const a = data[i+3];
    if (a < 10) continue;
    const r = data[i], g = data[i+1], b = data[i+2];
    const l = 0.299 * r + 0.587 * g + 0.114 * b;
    const sat = Math.max(r,g,b) - Math.min(r,g,b);
    totalL += l; totalR += r; totalG += g; totalB += b;
    totalSat += sat;
    samples.push({ l, r, g, b, sat });
    opaqueCount++;
  }

  if (opaqueCount < 10) {
    return { meanL: 128, stdL: 40, meanR: 128, meanG: 128, meanB: 128, meanSat: 30, count: 0 };
  }

  const meanL = totalL / opaqueCount;
  const meanR = totalR / opaqueCount;
  const meanG = totalG / opaqueCount;
  const meanB = totalB / opaqueCount;
  const meanSat = totalSat / opaqueCount;

  let varL = 0;
  for (const s of samples) varL += (s.l - meanL) ** 2;
  const stdL = Math.sqrt(varL / opaqueCount);

  console.log('🎯 贴纸分析:', {
    采样点数: opaqueCount,
    平均亮度: meanL.toFixed(1),
    亮度标准差: stdL.toFixed(1),
    平均颜色: `R${meanR.toFixed(0)} G${meanG.toFixed(0)} B${meanB.toFixed(0)}`,
    平均饱和度: meanSat.toFixed(1),
  });

  return { meanL, stdL, meanR, meanG, meanB, meanSat, count: opaqueCount };
}

function getStickerBoundingRect(sticker) {
  // Get bounding rect in canvas coordinates
  const w = sticker.width, h = sticker.height;
  const rad = sticker.rotation * Math.PI / 180;
  const cos = Math.abs(Math.cos(rad));
  const sin = Math.abs(Math.sin(rad));
  const boundW = w * cos + h * sin;
  const boundH = w * sin + h * cos;

  return {
    x: Math.max(0, Math.floor(sticker.x - boundW / 2)),
    y: Math.max(0, Math.floor(sticker.y - boundH / 2)),
    w: Math.min(canvas.width, Math.ceil(boundW)),
    h: Math.min(canvas.height, Math.ceil(boundH)),
  };
}

// Compute distance from each pixel to nearest transparent pixel (content edge)
// Uses 2-pass distance transform (Manhattan + diagonal approximation)
function computeEdgeDistance(data, w, h) {
  const INF = 9999;
  const dist = new Float32Array(w * h);

  // Initialize: 0 for transparent/edge, INF for interior opaque
  for (let i = 0; i < data.length; i += 4) {
    const idx = i / 4;
    const a = data[i + 3];
    if (a < 10) {
      dist[idx] = 0;
      continue;
    }
    // Check if this pixel is at the content edge (adjacent to any transparent pixel)
    const x = idx % w;
    const y = Math.floor(idx / w);
    let isEdge = false;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) { isEdge = true; break; }
        if (data[(ny * w + nx) * 4 + 3] < 10) { isEdge = true; break; }
      }
      if (isEdge) break;
    }
    dist[idx] = isEdge ? 1 : INF;
  }

  // Forward pass (top-left to bottom-right)
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (dist[idx] <= 1) continue;
      let minD = dist[idx];
      if (x > 0) minD = Math.min(minD, dist[y * w + (x - 1)] + 1);
      if (y > 0) minD = Math.min(minD, dist[(y - 1) * w + x] + 1);
      if (x > 0 && y > 0) minD = Math.min(minD, dist[(y - 1) * w + (x - 1)] + 1.4);
      if (x < w - 1 && y > 0) minD = Math.min(minD, dist[(y - 1) * w + (x + 1)] + 1.4);
      dist[idx] = minD;
    }
  }

  // Backward pass (bottom-right to top-left)
  for (let y = h - 1; y >= 0; y--) {
    for (let x = w - 1; x >= 0; x--) {
      const idx = y * w + x;
      if (dist[idx] <= 1) continue;
      let minD = dist[idx];
      if (x < w - 1) minD = Math.min(minD, dist[y * w + (x + 1)] + 1);
      if (y < h - 1) minD = Math.min(minD, dist[(y + 1) * w + x] + 1);
      if (x < w - 1 && y < h - 1) minD = Math.min(minD, dist[(y + 1) * w + (x + 1)] + 1.4);
      if (x > 0 && y < h - 1) minD = Math.min(minD, dist[(y + 1) * w + (x - 1)] + 1.4);
      dist[idx] = minD;
    }
  }

  return dist;
}

function applyAutoBlend(sticker, bg, st, params) {
  const { blendStrength, featherAmount, lightAngle, stylePreset } = params;

  // Get sticker pixel data at natural resolution
  const img = sticker.originalImage;
  const imgW = img.naturalWidth;
  const imgH = img.naturalHeight;
  const offCanvas = document.createElement('canvas');
  offCanvas.width = imgW;
  offCanvas.height = imgH;
  const offCtx = offCanvas.getContext('2d');
  offCtx.drawImage(img, 0, 0);
  const imageData = offCtx.getImageData(0, 0, imgW, imgH);
  const data = imageData.data;

  // === Step 1: Compute content-aware edge distance ===
  const edgeDist = computeEdgeDistance(data, imgW, imgH);

  // Feather: 2–15 px range, controlled by featherAmount (0-30 → 2-15px)
  const featherPx = 2 + Math.round(featherAmount * 13 / 30);

  // === Subtle exposure compensation ===
  // Only shift brightness slightly (max ~20% of the difference) so the sticker
  // doesn't look like a glowing cutout on dark backgrounds or vanish on bright ones.
  // blendStrength (10-100) maps to a max correction of 5%-25% of the BG/sticker gap.
  const maxCorrection = 0.05 + (blendStrength / 100) * 0.20; // 5% to 25%
  const lumDiff = bg.meanL - st.meanL;
  // Clamp: never shift more than ±40 luminance points
  const lumShift = Math.max(-40, Math.min(40, lumDiff * maxCorrection));

  // Color temperature: very subtle warm/cool hint (max ±3)
  const tempShift = (bg.meanR - bg.meanB) / 256 * maxCorrection * 3;

  console.log('🎨 融合（保留贴图原色）:', {
    羽化像素: featherPx,
    曝光补偿: lumShift.toFixed(1) + ' / ' + lumDiff.toFixed(0) + ' 差距',
    修正比例: (maxCorrection * 100).toFixed(0) + '%',
    色温微调: tempShift.toFixed(1),
  });

  // === Step 2: Apply subtle adjustments + edge feather ===
  for (let i = 0; i < data.length; i += 4) {
    const a = data[i + 3];
    if (a < 10) continue;

    let r = data[i];
    let g = data[i + 1];
    let b = data[i + 2];

    // Subtle exposure: scale RGB by luminance ratio (preserves hue)
    const oldL = 0.299 * r + 0.587 * g + 0.114 * b;
    const lRatio = oldL > 1 ? (oldL + lumShift) / oldL : 1;
    r = Math.round(r * lRatio);
    g = Math.round(g * lRatio);
    b = Math.round(b * lRatio);

    // Very subtle color temperature
    r += tempShift;
    b -= tempShift;

    // Clamp
    data[i]     = Math.max(0, Math.min(255, r));
    data[i + 1] = Math.max(0, Math.min(255, g));
    data[i + 2] = Math.max(0, Math.min(255, b));

    // Edge feather: fade alpha near content edges
    if (featherPx > 0) {
      const dist = edgeDist[i / 4];
      if (dist < featherPx) {
        const t = dist / featherPx;
        const smooth = t * t * (3 - 2 * t); // smoothstep
        data[i + 3] = Math.round(a * smooth);
      }
    }
  }

  // Style-specific post-processing (applied to imageData before putImageData)
  if (stylePreset) {
    if (stylePreset.posterize && stylePreset.posterLv > 0) {
      posterizeColors(imageData, stylePreset.posterLv);
    }
    if (stylePreset.desaturate && stylePreset.desatAmt > 0) {
      desaturateImage(imageData, stylePreset.desatAmt);
    }
  }

  // Put adjusted data back
  offCtx.putImageData(imageData, 0, 0);

  // Create adjusted image
  const adjustedImg = new Image();
  adjustedImg.src = offCanvas.toDataURL('image/png');
  sticker.adjustedImage = adjustedImg;

  // === Generate shadow ===
  // Shadow casts AWAY from the bright area toward the dark area
  const dispW = sticker.width;
  const dispH = sticker.height;
  const pad = Math.round(Math.max(dispW, dispH) * 0.2);
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = dispW + pad * 2;
  shadowCanvas.height = dispH + pad * 2;
  const shadowCtx = shadowCanvas.getContext('2d');

  // Lighting contrast determines shadow strength
  const lightingContrast = bg.stdL / 128; // 0.2–1.5 typical
  const baseShadowStrength = Math.max(0.3, Math.min(1.0, lightingContrast));
  const shadowStrMult = stylePreset ? stylePreset.shadowStr : 1.0;
  const distMult = stylePreset ? stylePreset.shadowDist : 1.0;
  const blurMult = stylePreset ? stylePreset.shadowBlur : 1.0;
  const shadowStrength = baseShadowStrength * shadowStrMult;

  // Shadow distance: 8–15% of sticker size, scaled by contrast + style
  const shadowDist = Math.max(8, Math.round(Math.min(dispW, dispH) * (0.08 + baseShadowStrength * 0.07) * distMult));
  const shadowBlur = Math.round(Math.max(4, shadowDist * (0.6 + (1 - baseShadowStrength) * 0.6) * blurMult));

  // Shadow direction: use LOCAL gradient around sticker (bg.gradH, bg.gradV)
  // gradH > 0 = brighter on right → shadow goes LEFT  (-gradH)
  // gradV > 0 = brighter on bottom → shadow goes UP    (-gradV)
  // Falls back to global lightAngle+180 if local gradient is too flat
  let shadowAngleRad;
  if (Math.abs(bg.gradH) > 0.3 || Math.abs(bg.gradV) > 0.3) {
    // atan2(y, x): y=-gradV (shadow goes up when brighter below), x=-gradH (shadow goes left when brighter right)
    const localAngle = Math.atan2(-bg.gradV, -bg.gradH);
    shadowAngleRad = localAngle;
    console.log('📍 使用局部阴影方向:', (localAngle * 180 / Math.PI).toFixed(0) + '°');
  } else {
    // Flat lighting: use global light angle + 180 (away from light)
    shadowAngleRad = (lightAngle + 180) * Math.PI / 180;
    console.log('🌍 使用全局阴影方向:', lightAngle.toFixed(0) + '° → 阴影 ' + ((lightAngle + 180) % 360).toFixed(0) + '°');
  }

  const shadowOffX = Math.cos(shadowAngleRad) * shadowDist;
  const shadowOffY = -Math.sin(shadowAngleRad) * shadowDist;

  console.log('🔦 阴影参数:', {
    阴影方向: (shadowAngleRad * 180 / Math.PI).toFixed(0) + '°',
    偏移: shadowOffX.toFixed(0) + ', ' + shadowOffY.toFixed(0),
    阴影距离: shadowDist + 'px',
    阴影模糊: shadowBlur + 'px',
    强度: shadowStrength.toFixed(2),
    背景对比度: bg.stdL.toFixed(1),
  });

  // Draw silhouette centered
  shadowCtx.save();
  shadowCtx.translate(pad, pad);
  shadowCtx.drawImage(offCanvas, 0, 0, dispW, dispH);
  shadowCtx.restore();
  shadowCtx.globalCompositeOperation = 'source-in';
  shadowCtx.fillStyle = 'rgba(0,0,0,1)';
  shadowCtx.fillRect(0, 0, shadowCanvas.width, shadowCanvas.height);
  shadowCtx.globalCompositeOperation = 'source-over';
  blurCanvas(shadowCanvas, shadowBlur);

  sticker.shadowCanvas = shadowCanvas;
  sticker.shadowEnabled = true;
  sticker.shadowOffsetX = shadowOffX;
  sticker.shadowOffsetY = shadowOffY;
  sticker.shadowOpacity = 0.15 + shadowStrength * 0.15; // 0.30 to 0.45 based on contrast

  console.log('✅ 融合完成！羽化:', featherPx+'px', '阴影偏移:', shadowDist+'px');
}

function blurCanvas(canvas, radius) {
  // Simple box blur approximation (3-pass)
  const ctx = canvas.getContext('2d');
  if (radius <= 0) return;

  // Use CSS filter blur on a temp canvas
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.filter = `blur(${radius}px)`;
  tempCtx.drawImage(canvas, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(tempCanvas, 0, 0);
}

// ==================== STYLE-AWARE EFFECTS ====================
// Color posterization — quantize RGB channels to N levels (cel-shading effect)
function posterizeColors(imageData, levels) {
  const data = imageData.data;
  const step = 256 / levels;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 10) continue;
    data[i]     = Math.round(data[i] / step) * step;
    data[i + 1] = Math.round(data[i + 1] / step) * step;
    data[i + 2] = Math.round(data[i + 2] / step) * step;
  }
}

// Desaturate — lerp each channel toward grayscale by amount (0=none, 1=full)
function desaturateImage(imageData, amount) {
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 10) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
    data[i]     = r + (gray - r) * amount;
    data[i + 1] = g + (gray - g) * amount;
    data[i + 2] = b + (gray - b) * amount;
  }
}

// Style presets — each style defines feather, shadow, exposure, and optional post-processing
function getStylePreset(styleKey) {
  const presets = {
    photo:  { label: '写实照片',   feather: 10, exposure: 25, shadowBlur: 1.0, shadowStr: 1.0, shadowDist: 1.0, posterize: false, posterLv: 0, desaturate: false, desatAmt: 0 },
    anime:  { label: '二次元/动漫', feather: 1,  exposure: 5,  shadowBlur: 0.35, shadowStr: 1.3, shadowDist: 1.1, posterize: true,  posterLv: 6, desaturate: false, desatAmt: 0 },
    sketch: { label: '黑白线稿',   feather: 2,  exposure: 30, shadowBlur: 0.5,  shadowStr: 0.5, shadowDist: 0.8, posterize: false, posterLv: 0, desaturate: true,  desatAmt: 0.45 },
    '3d':   { label: '3D渲染',     feather: 8,  exposure: 20, shadowBlur: 1.8,  shadowStr: 0.6, shadowDist: 0.9, posterize: false, posterLv: 0, desaturate: false, desatAmt: 0 },
  };
  return presets[styleKey] || presets.photo;
}

// ==================== STYLE DETECTION ====================
let detectedStyle = null;     // { style, confidence, metrics }
let userStyleOverride = null; // null=auto, or 'photo'|'anime'|'sketch'|'3d'

function detectImageStyle(img) {
  // Downsample to max 400px for speed
  const maxDim = 400;
  let sw = img.naturalWidth, sh = img.naturalHeight;
  const scale = Math.min(1, maxDim / Math.max(sw, sh));
  sw = Math.round(sw * scale);
  sh = Math.round(sh * scale);

  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0, sw, sh);
  const imageData = cx.getImageData(0, 0, sw, sh);
  const data = imageData.data;

  // Per-pixel analysis with step=2
  let sumSat = 0, sumR = 0, sumG = 0, sumB = 0;
  let sumR2 = 0, sumG2 = 0, sumB2 = 0, sumRG = 0, sumRB = 0, sumGB = 0;
  let sampleCount = 0;

  // Gradient histogram for edge/bimodality analysis
  const gradBins = new Uint32Array(32);

  // Color quantization set for palette complexity
  const colorSet = new Set();

  // First pass: basic stats + color complexity
  for (let y = 0; y < sh; y += 2) {
    for (let x = 0; x < sw; x += 2) {
      const i = (y * sw + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const sat = Math.max(r, g, b) - Math.min(r, g, b);

      sumSat += sat;
      sumR += r; sumG += g; sumB += b;
      sumR2 += r * r; sumG2 += g * g; sumB2 += b * b;
      sumRG += r * g; sumRB += r * b; sumGB += g * b;

      // Color complexity: quantize each channel to 8 levels (3 bits)
      const r8 = r >> 5, g8 = g >> 5, b8 = b >> 5;
      colorSet.add((r8 << 6) | (g8 << 3) | b8);

      sampleCount++;
    }
  }

  if (sampleCount < 100) return { style: 'photo', confidence: 0.5, metrics: {} };

  const meanSat = sumSat / sampleCount;

  // Grayscale correlation (Pearson)
  const meanR = sumR / sampleCount, meanG = sumG / sampleCount, meanB = sumB / sampleCount;
  const varR = sumR2 / sampleCount - meanR * meanR;
  const varG = sumG2 / sampleCount - meanG * meanG;
  const varB = sumB2 / sampleCount - meanB * meanB;
  const covRG = sumRG / sampleCount - meanR * meanG;
  const covRB = sumRB / sampleCount - meanR * meanB;
  const covGB = sumGB / sampleCount - meanG * meanB;
  const corrRG = varR > 0 && varG > 0 ? covRG / Math.sqrt(varR * varG) : 0;
  const corrRB = varR > 0 && varB > 0 ? covRB / Math.sqrt(varR * varB) : 0;
  const corrGB = varG > 0 && varB > 0 ? covGB / Math.sqrt(varG * varB) : 0;
  const grayCorr = (corrRG + corrRB + corrGB) / 3;

  // Color complexity
  const colorComplexity = colorSet.size / sampleCount;

  // Second pass: gradient magnitudes for edge density + bimodality
  for (let y = 2; y < sh - 2; y += 2) {
    for (let x = 2; x < sw - 2; x += 2) {
      const i = (y * sw + x) * 4;
      const iL = ((y) * sw + (x - 2)) * 4;
      const iR = ((y) * sw + (x + 2)) * 4;
      const iU = ((y - 2) * sw + (x)) * 4;
      const iD = ((y + 2) * sw + (x)) * 4;
      const lC = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      const lL = 0.299 * data[iL] + 0.587 * data[iL + 1] + 0.114 * data[iL + 2];
      const lR = 0.299 * data[iR] + 0.587 * data[iR + 1] + 0.114 * data[iR + 2];
      const lU = 0.299 * data[iU] + 0.587 * data[iU + 1] + 0.114 * data[iU + 2];
      const lD = 0.299 * data[iD] + 0.587 * data[iD + 1] + 0.114 * data[iD + 2];
      const gx = lR - lL;
      const gy = lD - lU;
      const mag = Math.sqrt(gx * gx + gy * gy);
      const binIdx = Math.min(31, Math.floor(mag / 8));
      gradBins[binIdx]++;
    }
  }

  // Edge density: proportion of pixels with significant gradient
  let totalGrad = 0, edgePixels = 0, flatPixels = 0, sharpPixels = 0;
  for (let i = 0; i < 32; i++) totalGrad += gradBins[i];
  if (totalGrad > 0) {
    for (let i = 0; i < 2; i++) flatPixels += gradBins[i];    // bins 0-1: gradient < 16
    for (let i = 10; i < 32; i++) sharpPixels += gradBins[i]; // bins 10-31: gradient > 80
  }
  const edgeDensity = totalGrad > 0 ? (totalGrad - gradBins[0] - gradBins[1]) / totalGrad : 0;
  const bimodalityScore = flatPixels > 0 ? sharpPixels / flatPixels : 0;

  // === Classification ===
  let style, confidence;

  if (meanSat < 12 && grayCorr > 0.92) {
    style = 'sketch';
    confidence = 0.80 + Math.min(0.15, (grayCorr - 0.92) * 2);
  } else if (colorComplexity < 0.06 && bimodalityScore > 2.0 && edgeDensity > 0.10) {
    style = 'anime';
    confidence = 0.75 + Math.min(0.20, bimodalityScore * 0.05);
  } else if (colorComplexity > 0.10 && edgeDensity > 0.08) {
    style = 'photo';
    confidence = 0.70 + Math.min(0.20, (colorComplexity - 0.10) * 3);
  } else if (colorComplexity < 0.04 && edgeDensity < 0.06) {
    style = '3d';
    confidence = 0.55;
  } else {
    style = 'photo';
    confidence = 0.50;
  }

  const metrics = { meanSat, grayCorr, colorComplexity, edgeDensity, bimodalityScore, sampleCount };
  console.log('🔬 风格检测:', getStylePreset(style).label, Math.round(confidence * 100) + '%', metrics);

  return { style, confidence: Math.min(0.95, confidence), metrics };
}

function updateStyleIndicator() {
  const indicator = document.getElementById('styleIndicator');
  if (!indicator) return;
  const effective = userStyleOverride || (detectedStyle ? detectedStyle.style : null);
  if (!effective) {
    indicator.style.display = 'none';
    return;
  }
  const preset = getStylePreset(effective);
  const confText = (!userStyleOverride && detectedStyle)
    ? ' (' + Math.round(detectedStyle.confidence * 100) + '%)'
    : '';
  indicator.style.display = '';
  indicator.textContent = '🎯 ' + preset.label + confText;
}

function resetStickerAdjustments() {
  if (!selectedId) return;
  saveUndo();
  const sticker = stickers.find(s => s.id === selectedId);
  if (!sticker) return;
  sticker.adjustedImage = null;
  sticker.adjustments = null;
  sticker.shadowEnabled = false;
  sticker.shadowCanvas = null;
  render();
  showToast('↩ 融合效果已撤销');
}

// ==================== EXPORT ====================
function downloadResult() {
  if (!bgImage && stickers.length === 0) {
    showToast('⚠️ 画布为空，请先添加内容');
    return;
  }

  const format = document.getElementById('exportFormat').value;
  const quality = parseInt(document.getElementById('exportQuality').value) / 100;
  let mimeType, ext;
  if (format === 'jpeg') { mimeType = 'image/jpeg'; ext = 'jpg'; }
  else if (format === 'webp') { mimeType = 'image/webp'; ext = 'webp'; }
  else { mimeType = 'image/png'; ext = 'png'; }

  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;
  const exportCtx = exportCanvas.getContext('2d');

  // JPEG/WebP need opaque background; fill white first if no bgImage
  const needsOpaqueBg = (format === 'jpeg') && !bgImage;
  if (needsOpaqueBg) {
    exportCtx.fillStyle = '#ffffff';
    exportCtx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw background
  if (bgImage) {
    exportCtx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  } else if (format === 'png') {
    exportCtx.fillStyle = '#ffffff';
    exportCtx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Draw stickers (back to front)
  for (const sticker of stickers) {
    exportCtx.save();
    exportCtx.translate(sticker.x, sticker.y);
    const img = sticker.adjustedImage || sticker.image;
    const w = sticker.width, h = sticker.height;
    const sx = sticker.flipH ? -1 : 1;
    const sy = sticker.flipV ? -1 : 1;

    if (sticker.shadowEnabled && sticker.shadowCanvas) {
      exportCtx.save();
      exportCtx.globalAlpha = (sticker.shadowOpacity || 0.3) * sticker.opacity * 0.8;
      exportCtx.translate(sticker.shadowOffsetX || 0, sticker.shadowOffsetY || 0);
      exportCtx.rotate(sticker.rotation * Math.PI / 180);
      exportCtx.scale(sx, sy);
      const sCanvas = sticker.shadowCanvas;
      exportCtx.drawImage(sCanvas, -sCanvas.width/2, -sCanvas.height/2, sCanvas.width, sCanvas.height);
      exportCtx.restore();
    }

    exportCtx.rotate(sticker.rotation * Math.PI / 180);
    exportCtx.scale(sx, sy);
    exportCtx.globalAlpha = sticker.opacity;
    exportCtx.drawImage(img, -w/2, -h/2, w, h);
    exportCtx.restore();
  }

  // Download
  exportCanvas.toBlob((blob) => {
    if (!blob) { showToast('❌ 导出失败'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'composite_' + Date.now() + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const sizeKB = (blob.size / 1024).toFixed(0);
    showToast('✅ ' + ext.toUpperCase() + ' ' + sizeKB + 'KB 已下载');
  }, mimeType, quality);
}

function onExportFormatChange() {
  const fmt = document.getElementById('exportFormat').value;
  const wrap = document.getElementById('exportQualityWrap');
  wrap.style.display = (fmt === 'jpeg' || fmt === 'webp') ? 'flex' : 'none';
}

// ==================== RESET ====================
function resetAll() {
  bgImage = null;
  bgImageData = null;
  stickers = [];
  selectedId = null;
  stickerIdCounter = 0;
  interactionMode = null;
  detectedStyle = null;
  userStyleOverride = null;
  initCanvas();
  document.getElementById('dropZone').style.display = '';
  document.getElementById('bottomBar').style.display = '';
  document.getElementById('noSelectionHint').style.display = '';
  document.getElementById('stickerProps').style.display = 'none';
  document.getElementById('btnBlend').disabled = true;
  const styleSelect = document.getElementById('propStyle');
  if (styleSelect) styleSelect.value = 'auto';
  const indicator = document.getElementById('styleIndicator');
  if (indicator) indicator.style.display = 'none';
  render();
  showToast('🔄 已重置');
}

// ==================== HELPERS ====================
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== UNDO / REDO ====================
const MAX_UNDO = 40;
let undoStack = [];
let redoStack = [];

function snapshotState() {
  const bgSnap = bgImage ? { src: bgImage.src, w: canvas.width, h: canvas.height } : null;
  const stickersSnap = stickers.map(s => ({
    id: s.id, type: s.type, x: s.x, y: s.y,
    width: s.width, height: s.height, rotation: s.rotation, opacity: s.opacity,
    flipH: !!s.flipH, flipV: !!s.flipV,
    imageSrc: s.image.src,
    originalImageSrc: s.originalImage.src,
    adjustedImageSrc: s.adjustedImage ? s.adjustedImage.src : null,
    shadowEnabled: !!s.shadowEnabled,
    shadowCanvasUrl: s.shadowCanvas ? s.shadowCanvas.toDataURL() : null,
    shadowOffsetX: s.shadowOffsetX || 0,
    shadowOffsetY: s.shadowOffsetY || 0,
    shadowOpacity: s.shadowOpacity || 0.3,
    adjustments: s.adjustments ? JSON.parse(JSON.stringify(s.adjustments)) : null,
  }));
  return { bgSnap, stickersSnap, selectedId, stickerIdCounter };
}

function saveUndo() {
  redoStack = [];
  undoStack.push(snapshotState());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateUndoButtons();
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(snapshotState());
  restoreSnapshot(undoStack.pop());
  updateUndoButtons();
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(snapshotState());
  restoreSnapshot(redoStack.pop());
  updateUndoButtons();
}

function restoreSnapshot(state) {
  // Restore background
  if (state.bgSnap) {
    const img = new Image();
    img.onload = () => {
      bgImage = img;
      initCanvas(state.bgSnap.w, state.bgSnap.h);
      ctx.drawImage(img, 0, 0, state.bgSnap.w, state.bgSnap.h);
      bgImageData = ctx.getImageData(0, 0, state.bgSnap.w, state.bgSnap.h);
      hideDropZone();
      document.getElementById('bottomBar').style.display = 'none';
      document.getElementById('btnBlend').disabled = !selectedId;
      restoreStickersAndFinish(state);
    };
    img.src = state.bgSnap.src;
  } else {
    bgImage = null; bgImageData = null;
    initCanvas();
    document.getElementById('dropZone').style.display = '';
    document.getElementById('bottomBar').style.display = '';
    document.getElementById('btnBlend').disabled = true;
    restoreStickersAndFinish(state);
  }
}

function restoreStickersAndFinish(state) {
  stickers = state.stickersSnap.map(snap => {
    const img = new Image(); img.src = snap.imageSrc;
    const origImg = new Image(); origImg.src = snap.originalImageSrc;
    const s = {
      id: snap.id, type: snap.type, image: img, originalImage: origImg,
      x: snap.x, y: snap.y, width: snap.width, height: snap.height,
      rotation: snap.rotation, opacity: snap.opacity,
      flipH: snap.flipH, flipV: snap.flipV,
      shadowEnabled: snap.shadowEnabled,
      shadowCanvas: null,
      shadowOffsetX: snap.shadowOffsetX,
      shadowOffsetY: snap.shadowOffsetY,
      shadowOpacity: snap.shadowOpacity,
      adjustedImage: null,
      adjustments: snap.adjustments,
    };
    if (snap.adjustedImageSrc) {
      const adj = new Image(); adj.src = snap.adjustedImageSrc;
      s.adjustedImage = adj;
    }
    if (snap.shadowCanvasUrl) {
      const shImg = new Image();
      shImg.onload = () => {
        const sc = document.createElement('canvas');
        sc.width = shImg.naturalWidth; sc.height = shImg.naturalHeight;
        sc.getContext('2d').drawImage(shImg, 0, 0);
        s.shadowCanvas = sc;
        if (s.id === selectedId) render();
      };
      shImg.src = snap.shadowCanvasUrl;
    }
    return s;
  });

  selectedId = state.selectedId;
  stickerIdCounter = state.stickerIdCounter;

  // Update UI
  if (selectedId) {
    const st = stickers.find(s => s.id === selectedId);
    document.getElementById('noSelectionHint').style.display = 'none';
    document.getElementById('stickerProps').style.display = '';
    document.getElementById('btnBlend').disabled = !bgImage;
    if (st) {
      const origW = st.originalImage.naturalWidth || 1;
      document.getElementById('propScale').value = Math.round(st.width / origW * 100);
      document.getElementById('propScaleVal').textContent = Math.round(st.width / origW * 100) + '%';
      document.getElementById('propRotate').value = Math.round(st.rotation);
      document.getElementById('propRotateVal').textContent = Math.round(st.rotation) + '°';
      document.getElementById('propOpacity').value = Math.round(st.opacity * 100);
      document.getElementById('propOpacityVal').textContent = Math.round(st.opacity * 100) + '%';
      updateFlipButtons(st);
    }
  } else {
    document.getElementById('noSelectionHint').style.display = '';
    document.getElementById('stickerProps').style.display = 'none';
    if (!bgImage) document.getElementById('bottomBar').style.display = '';
  }
  render();
}

function updateUndoButtons() {
  const bu = document.getElementById('btnUndo');
  const br = document.getElementById('btnRedo');
  if (bu) bu.disabled = undoStack.length === 0;
  if (br) br.disabled = redoStack.length === 0;
}

// ==================== KEYBOARD SHORTCUTS ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedId && document.activeElement === document.body) {
      deleteSelectedSticker();
    }
  }
  if (e.key === 'Escape') {
    deselectAll();
  }
  if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    undo();
  }
  if ((e.ctrlKey && e.key === 'Z' && e.shiftKey) || (e.ctrlKey && e.key === 'y')) {
    e.preventDefault();
    redo();
  }
});

// ==================== INIT ====================
function fitCanvasToContainer() {
  if (!bgImage) { initCanvas(); render(); }
}
initCanvas();
loadCustomStickers().then(() => {
  renderCustomStickerGrid();
});
render();
// Re-fit the default canvas whenever the canvas area size changes
// (panels loading, device rotation, browser toolbar show/hide, window resize).
if ('ResizeObserver' in window) {
  new ResizeObserver(fitCanvasToContainer).observe(document.getElementById('canvasContainer'));
} else {
  window.addEventListener('resize', fitCanvasToContainer);
}

// ==================== MOBILE SLIDER FIX ====================
// On touch devices, tapping a range slider jumps it to the touched spot,
// causing accidental changes (e.g. scale 10% -> 200%). Instead, require a
// horizontal drag gesture: value changes relative to its current value.
// Mouse/desktop behaviour is unchanged (only touch events are intercepted).
function setupDragOnlySliders() {
  document.querySelectorAll('input[type="range"]').forEach(function(slider) {
    const min = parseFloat(slider.min), max = parseFloat(slider.max);
    const range = max - min;
    let drag = null;
    slider.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, v: parseFloat(slider.value) };
      e.preventDefault(); // stop the browser from jumping to the touched position
    }, { passive: false });
    slider.addEventListener('touchmove', function(e) {
      if (!drag || e.touches.length !== 1) return;
      const t = e.touches[0];
      const dx = t.clientX - drag.x;
      const dy = t.clientY - drag.y;
      // only treat clearly-horizontal movement as a slider drag
      if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy)) {
        const width = slider.getBoundingClientRect().width || 100;
        slider.value = Math.round(Math.min(max, Math.max(min, drag.v + (dx / width) * range)));
        slider.dispatchEvent(new Event('input', { bubbles: true }));
        e.preventDefault();
      }
    }, { passive: false });
    slider.addEventListener('touchend', function() { drag = null; });
    slider.addEventListener('touchcancel', function() { drag = null; });
  });
}
setupDragOnlySliders();
